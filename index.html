        <tr><td>Tipo</td><td>A categoria (Adoração, Missa, Batizado…).</td></tr>
        <tr><td>Local</td><td>Onde o evento acontece.</td></tr>
        <tr><td>Data de início</td><td>A data da primeira vez. Em eventos que se repetem, é também a <strong>base</strong> da repetição.</td></tr>
        <tr><td>Horário (início)</td><td>A hora em que o evento começa.</td></tr>
        <tr><td>Horário de chegada</td><td>Quando a equipe deve chegar. Vem preenchido <strong>1 hora antes</strong>, e pode ser mudado.</td></tr>
        <tr><td>Previsão de término</td><td>Quando deve terminar. Vem preenchido <strong>1h30 depois</strong> do início, e pode ser ajustado.</td></tr>
        <tr><td>Pessoas necessárias</td><td>Quantas pessoas (vagas) cada ocorrência precisa.</td></tr>
        <tr><td>Repetição</td><td>Se e como o evento se repete (veja abaixo).</td></tr>
        <tr><td>Observação</td><td>Recado opcional (ex.: "levar a toalha do altar"). Aparece no PNG e no PDF.</td></tr>
      </table>
      <div class="man-box man-nota"><span class="bt">Os três horários</span>Chegada, início e término aparecem na imagem (PNG) e no PDF enviados às equipes. Ao mudar o <strong>início</strong>, a chegada e o término se reajustam sozinhos — depois você afina se precisar.</div>
      <h3>Repetição (igual à da agenda do celular)</h3>
      <p>No campo <span class="man-fld">Repetição</span> você escolhe: <strong>Não repete</strong>, <strong>Diário</strong>, <strong>Semanal</strong>, <strong>Mensal</strong> ou <strong>Anual</strong>. Conforme a escolha, aparecem opções extras:</p>
      <ul>
        <li><span class="man-fld">Repetir a cada</span> — o intervalo (ex.: a cada 2 semanas).</li>
        <li><span class="man-fld">Repete em</span> — no tipo <em>Semanal</em>, marque os dias (Seg, Qua, Sex…).</li>
        <li><span class="man-fld">Padrão mensal</span> — no tipo <em>Mensal</em>: repetir <strong>no dia</strong> (ex.: todo dia 13) ou <strong>na posição</strong> (ex.: na 1ª sexta do mês).</li>
        <li><span class="man-fld">Termina</span> — <strong>Nunca</strong>, <strong>Em</strong> uma data, ou <strong>Após</strong> um número de vezes.</li>
      </ul>
      <h4>Exemplos prontos</h4>
      <table class="man-table">
        <tr><th>Você quer…</th><th>Repetição</th><th>Como configurar</th></tr>
        <tr><td>Adoração toda quinta, sem fim</td><td>Semanal</td><td>Repete em: <strong>Qui</strong> · Termina: <strong>Nunca</strong></td></tr>
        <tr><td>Missa toda 1ª sexta do mês</td><td>Mensal</td><td>Padrão mensal: <strong>Na 1ª sexta</strong></td></tr>
        <tr><td>Encontro no dia 13 de todo mês</td><td>Mensal</td><td>Padrão mensal: <strong>No dia 13</strong></td></tr>
        <tr><td>Reunião a cada 15 dias</td><td>Diário</td><td>Repetir a cada: <strong>15</strong> dias</td></tr>
        <tr><td>Só seg, qua e sex</td><td>Semanal</td><td>Repete em: <strong>Seg, Qua, Sex</strong></td></tr>
        <tr><td>Um batizado único</td><td>Não repete</td><td>Basta a <strong>Data de início</strong></td></tr>
      </table>
      <p>Ao terminar, clique em <span class="man-ui">Cadastrar evento</span>. Para alterar depois, use <strong>editar/remover</strong> na lista.</p>
      <div class="man-box man-dica"><span class="bt">Dica</span>Não crie um evento para cada semana — crie <strong>um só</strong> com repetição. Para tirar apenas <strong>um dia</strong> (um feriado), use "Remover este dia" na própria escala, sem apagar a repetição (seção 9).</div>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">7</div><h2>Restrições (quem não pode em tal dia)</h2></div>
      <p>Aqui você informa os dias em que <strong>cada pessoa não pode servir</strong>. Vá na aba <span class="man-tab">Restrições</span>.</p>
      <ol class="man-steps">
        <li>Em <span class="man-fld">1 · Membro</span>, escolha a pessoa.</li>
        <li>No <strong>calendário</strong>, use as <strong>setas</strong> para mudar de mês.</li>
        <li>Clique nos <strong>dias</strong> em que a pessoa não pode (ficam amarelos).</li>
        <li>Clique em <span class="man-ui">Salvar restrições</span>. Os dias salvos ficam vermelhos.</li>
      </ol>
      <div class="man-box man-aten"><span class="bt">Regra absoluta</span>Restrição é uma regra que o sistema <strong>sempre</strong> respeita: a pessoa não é escalada naquele dia, em hipótese alguma. Lance as restrições <strong>antes</strong> de gerar a escala.</div>
      <h3>Recolher restrições pelo Excel (opcional)</h3>
      <ol class="man-steps">
        <li>Clique em <span class="man-ui">Exportar Excel</span> — baixa uma planilha com os eventos do mês e os nomes.</li>
        <li>Compartilhe (Drive, WhatsApp) e peça que <strong>cada pessoa marque</strong> os dias em que não pode.</li>
        <li>De volta no sistema, use <strong>Importar</strong> e selecione a planilha — as restrições entram de uma vez.</li>
      </ol>
      <h3>Fases e datas de formação (restrição automática por grupo)</h3>
      <p>As <strong>fases</strong> agrupam os membros (Pré-discípulos, Bento, Shemá...). Cada fase tem suas <strong>datas de formação</strong> — e nessas datas <strong>ninguém daquela fase</strong> é escalado, automaticamente. É a forma rápida de bloquear um grupo inteiro sem marcar pessoa por pessoa.</p>
      <ol class="man-steps">
        <li>Na aba <span class="man-tab">Fases</span>, digite o nome da fase e tecle Enter.</li>
        <li>No cartão da fase, escolha uma data e clique em <span class="man-ui">Adicionar data</span> para registrar uma data de formação (repita para cada data).</li>
        <li>Na aba <span class="man-tab">Membros</span>, no seletor ao lado de cada pessoa, diga a <strong>fase</strong> dela.</li>
      </ol>
      <div class="man-box man-dica"><span class="bt">Pronto, é automático</span>Ao gerar a escala, quem está numa fase já entra <strong>bloqueado</strong> nas datas de formação daquela fase — somando-se às restrições pessoais. Não precisa marcar nada na aba Restrições para isso.</div>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">8</div><h2>Gerar a escala do mês</h2></div>
      <p>Com membros, eventos e restrições prontos, vá na aba <span class="man-tab">Escala</span>.</p>
      <ol class="man-steps">
        <li>No topo, use as setas para chegar ao <strong>mês</strong> desejado.</li>
        <li>Clique em <span class="man-ui">Gerar escala</span> (se já existir uma, o botão diz <span class="man-ui">Gerar novamente</span>).</li>
      </ol>
      <p>O sistema preenche cada evento dando preferência a <strong>quem serviu menos</strong>, respeitando restrições e choques de horário. Acima aparecem quatro números: <strong>Eventos</strong> (ocorrências do mês), <strong>Vagas</strong> (lugares a preencher), <strong>Preenchidas</strong> e <strong>Em aberto</strong> (vagas que ficaram sem ninguém).</p>
      <div class="man-box man-dica"><span class="bt">Sobrou vaga "Em aberto"?</span>Naquele dia não havia pessoas suficientes disponíveis (muita restrição ou poucos ativos). Cadastre mais membros, reveja restrições, ou preencha a vaga à mão (seção 9).</div>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">9</div><h2>Conferir e ajustar à mão</h2></div>
      <p>Cada dia aparece num cartão com as pessoas escaladas. Você pode mexer livremente:</p>
      <ul>
        <li><strong>Preencher/trocar vaga:</strong> as vagas em aberto aparecem como um botão <span class="man-ui red">+ Vaga livre</span> vermelho. Clique e escolha a pessoa.</li>
        <li><strong>Tirar alguém:</strong> clique no <strong>×</strong> ao lado do nome.</li>
        <li><strong>Adicionar pessoa extra:</strong> use o "+ adicionar pessoa" no cartão.</li>
        <li><strong>Remover um dia</strong> (feriado, cancelamento): use <strong>"Remover este dia (feriado/conflito)"</strong> — tira só aquela data, <strong>sem apagar</strong> a repetição. Dá para restaurar depois.</li>
      </ul>
      <h3>Trocar e transferir membros</h3>
      <p>Para mover alguém de um serviço para outro, ou trocar duas pessoas de lugar, use o modo "mover":</p>
      <ol class="man-steps">
        <li>Clique no <strong>nome</strong> da pessoa — ele ganha um contorno dourado (está "pego") e surge uma faixa no topo avisando quem você está movendo.</li>
        <li>Para <strong>transferir</strong>: clique em <span class="man-ui">Mover [nome] para cá</span> no serviço de destino.</li>
        <li>Para <strong>trocar</strong> duas pessoas: clique no <strong>nome da outra pessoa</strong> — elas trocam de lugar.</li>
        <li>Clicar no mesmo nome de novo, ou em <strong>Cancelar</strong>, sai do modo sem mexer em nada.</li>
      </ol>
      <div class="man-box man-nota"><span class="bt">Proteção automática</span>O sistema não deixa transferir/trocar para um dia em que a pessoa tem <strong>restrição</strong>, nem deixar alguém com <strong>dois serviços no mesmo dia</strong> — se tentar, ele avisa e não conclui a troca.</div>
      <h3>Selo de restrição em cada dia</h3>
      <p>No cartão, ao lado do status, há um selo <strong>🚫 com o número</strong> de pessoas indisponíveis naquele dia. Clicando em <strong>"ver nomes"</strong>, ele mostra <strong>quem</strong> está restrito ali — só informativo, ajuda a entender as escolhas do sistema.</p>
      <div class="man-box man-aten"><span class="bt">Aviso de conflito (vermelho)</span>Se aparecer uma faixa vermelha de "conflitos com restrições", é porque alguém ficou escalado num dia restrito — normalmente porque você <strong>mudou as restrições depois</strong> de gerar. Clique em <span class="man-ui">Gerar novamente</span> e o sistema corrige.</div>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">10</div><h2>Salvar a escala</h2></div>
      <p>Quando estiver satisfeito, clique em <span class="man-ui">Salvar escala do mês</span>. Um selo <strong>"salva"</strong> confirma.</p>
      <div class="man-box man-nota"><span class="bt">Por que salvar importa</span>Salvar é como o sistema <strong>registra quem serviu</strong> naquele mês. Esse histórico é o que mantém o rodízio justo nos <strong>meses seguintes</strong> — quem serviu mais espera a vez, quem serviu menos entra primeiro. Salve sempre antes de passar para o próximo mês.</div>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">11</div><h2>Calendário e imagem (PNG) por dia</h2></div>
      <p class="man-lead">A forma de avisar cada equipe: uma imagem bonita, por dia, pronta para o grupo do WhatsApp.</p>
      <ol class="man-steps">
        <li>Na aba <span class="man-tab">Escala</span> (com a escala gerada), clique em <span class="man-ui">Calendário</span>.</li>
        <li>Abre o <strong>mês inteiro</strong>. Cada dia mostra os eventos e quantas pessoas estão alocadas (<strong>alocadas/total</strong>).</li>
        <li>Clique num <strong>dia</strong> com eventos.</li>
        <li>À direita aparece o <strong>detalhe completo</strong>: <strong>chegada, início e término</strong>, local, observações e os <strong>nomes completos</strong>.</li>
        <li>Clique em <span class="man-ui">Baixar PNG deste dia</span> e envie no grupo.</li>
      </ol>
      <div class="man-box man-dica"><span class="bt">Como fica o PNG</span>Traz o logo do Instituto, o título do dia e, para cada evento, a linha <strong>Chegar • Início • Término</strong>, o local, as observações e a lista de pessoas <strong>uma embaixo da outra</strong>. Se faltar gente, aparece "X vaga(s) em aberto".</div>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">12</div><h2>PDF do mês (por dia, local ou membro)</h2></div>
      <p>Na aba <span class="man-tab">Escala</span>, em <strong>"Ver / baixar PDF"</strong>, há três visões: <strong>Por dia</strong> (cada dia e quem serve), <strong>Por local</strong> (agrupado por lugar) e <strong>Por membro</strong> (os dias de cada pessoa).</p>
      <ol class="man-steps">
        <li>Clique em <strong>Por dia</strong>, <strong>Por local</strong> ou <strong>Por membro</strong>. O resultado aparece <strong>na própria tela</strong> (prévia).</li>
        <li>Gostou? Clique em <span class="man-ui">Baixar PDF</span> dentro da prévia para salvar.</li>
        <li>Para fechar, clique de novo no botão ou em <strong>Fechar prévia</strong>.</li>
      </ol>
      <div class="man-box man-nota"><span class="bt">Lembre</span>O botão só <strong>mostra</strong> a prévia. O arquivo só é salvo ao clicar em <strong>Baixar PDF</strong>.</div>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">13</div><h2>Como o rodízio é calculado</h2></div>
      <ol class="man-steps">
        <li>O sistema lista todas as ocorrências do mês, em ordem de data.</li>
        <li>Para cada vaga, separa quem <strong>pode</strong>: precisa estar <strong>Ativo</strong>, não ter <strong>restrição</strong> no dia e não estar em <strong>outro evento no mesmo horário</strong>.</li>
        <li>Entre os que podem, escolhe primeiro <strong>quem serviu menos</strong>. Em empate, prioriza quem está <strong>há mais tempo sem servir</strong>.</li>
        <li>A cada mês <strong>salvo</strong>, esse placar é atualizado — por isso o equilíbrio melhora com o tempo.</li>
      </ol>
      <p>No lado direito da aba <span class="man-tab">Escala</span>, o painel <strong>"Equilíbrio de serviço"</strong> mostra, em barras, quanto cada pessoa serviu.</p>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">14</div><h2>Perguntas frequentes</h2></div>
      <h4>Mudei as restrições, mas a escala não mudou.</h4>
      <p>A escala não se atualiza sozinha. Clique em <span class="man-ui">Gerar novamente</span> na aba Escala.</p>
      <h4>Apareceu alguém num dia em que tem restrição.</h4>
      <p>É uma escala antiga (gerada antes da restrição). A faixa vermelha avisa — clique em <span class="man-ui">Gerar novamente</span>.</p>
      <h4>Uma pessoa vai se ausentar por meses.</h4>
      <p>Deixe-a <strong>Inativa</strong> na aba Membros; reative quando voltar.</p>
      <h4>Preciso tirar só um feriado de um evento que se repete.</h4>
      <p>No cartão do dia, use <strong>"Remover este dia (feriado/conflito)"</strong> — os outros dias seguem normais.</p>
      <h4>Como recomeçar do zero?</h4>
      <p>No rodapé da página há o link <strong>"Apagar tudo e recomeçar"</strong>. Apaga <strong>todos</strong> os cadastros e escalas — use com cuidado, não tem como desfazer.</p>
    </section>

    <section class="man-sec">
      <div class="man-sec-head"><div class="man-num">15</div><h2>Checklist do mês</h2></div>
      <table class="man-table">
        <tr><th style="width:40px">✓</th><th>Passo</th></tr>
        <tr><td>☐</td><td>Atualizar <strong>membros</strong> (novos / inativos).</td></tr>
        <tr><td>☐</td><td>Conferir os <strong>eventos</strong> do mês (criar pontuais, ajustar horários).</td></tr>
        <tr><td>☐</td><td>Lançar as <strong>restrições</strong> de cada pessoa.</td></tr>
        <tr><td>☐</td><td>Aba <span class="man-tab">Escala</span> → escolher o mês → <span class="man-ui">Gerar escala</span>.</td></tr>
        <tr><td>☐</td><td>Conferir conflitos e vagas em aberto; ajustar à mão se quiser.</td></tr>
        <tr><td>☐</td><td><span class="man-ui">Salvar escala do mês</span> (essencial para o rodízio).</td></tr>
        <tr><td>☐</td><td>Abrir o <span class="man-ui">Calendário</span>, baixar o <strong>PNG de cada dia</strong> e enviar nos grupos.</td></tr>
        <tr><td>☐</td><td>(Opcional) Baixar o <strong>PDF do mês</strong>.</td></tr>
      </table>
      <div class="man-box man-dica"><span class="bt">Pronto!</span>Seguindo este checklist, a escala do mês fica montada, justa e comunicada a todos em poucos minutos.</div>
      <div class="man-actions man-noprint" style="margin-top:18px"><button class="man-print-btn" data-action="imprimirManual">${ico('pdf')} Imprimir / Salvar PDF</button></div>
    </section>
  </div>`;
}
/* ---------- Trocar / transferir membros ---------- */
function occByKey(k){ return construirOccs(selAno,selMes).find(o=>o.key===k); }
function podeMoverPara(id, occDest, keyDest, keyOrigem){
  if(!occDest) return {ok:false, msg:'Serviço indisponível'};
  if(restritoNoDia(id,occDest.data)) return {ok:false, msg:`${nomeMembro(id)} tem restrição em ${formatData(occDest.data).dm}`};
  if(!elegivelNoEvento(id,occDest)) return {ok:false, msg:`${nomeMembro(id)} não está liberado para servir nesse serviço`};
  const ea=garantirEscalaAtual();
  for(const o of construirOccs(selAno,selMes)){ if(o.key===keyDest||o.key===keyOrigem) continue; if(o.data===occDest.data&&(ea.atribuicoes[o.key]||[]).includes(id)) return {ok:false, msg:`${nomeMembro(id)} já serve em ${formatData(occDest.data).dm} (máx. 1 por dia)`}; }
  return {ok:true};
}
function pegar(occKey, id){
  if(movendo&&movendo.occ===occKey&&movendo.id===id){ movendo=null; render(); return; }   // clicar de novo cancela
  if(movendo){ trocar(movendo.occ, movendo.id, occKey, id); return; }                        // já havia um pego -> troca
  movendo={occ:occKey, id}; render();                                                        // pega
}
function cancelarMover(){ movendo=null; render(); }
function trocar(occA, idA, occB, idB){
  movendo=null;
  if(occA===occB){ render(); return; }
  const ea=garantirEscalaAtual();
  const c1=podeMoverPara(idA, occByKey(occB), occB, occA); if(!c1.ok){ toast(c1.msg); render(); return; }
  const c2=podeMoverPara(idB, occByKey(occA), occA, occB); if(!c2.ok){ toast(c2.msg); render(); return; }
  ea.atribuicoes[occA]=(ea.atribuicoes[occA]||[]).map(x=>x===idA?idB:x);
  ea.atribuicoes[occB]=(ea.atribuicoes[occB]||[]).map(x=>x===idB?idA:x);
  render(); toast(`Trocados: ${nomeMembro(idA)} ↔ ${nomeMembro(idB)}`);
}
function soltarVaga(occKey){
  if(!movendo) return;
  const occOrig=movendo.occ, id=movendo.id; movendo=null;
  if(occOrig===occKey){ render(); return; }
  const ea=garantirEscalaAtual();
  const c=podeMoverPara(id, occByKey(occKey), occKey, occOrig); if(!c.ok){ toast(c.msg); render(); return; }
  ea.atribuicoes[occOrig]=(ea.atribuicoes[occOrig]||[]).filter(x=>x!==id);
  ea.atribuicoes[occKey]=[...(ea.atribuicoes[occKey]||[]), id];
  render(); toast(`${nomeMembro(id)} transferido`);
}
/* ---------- Fases ---------- */
function restritoNoDia(membroId, data){
  if(db.restricoes.some(r=>r.membroId===membroId&&r.data===data)) return true;
  const m=db.membros.find(x=>x.id===membroId);
  if(m&&m.faseId){ const fa=(db.fases||[]).find(x=>x.id===m.faseId); if(fa&&(fa.datas||[]).includes(data)) return true; }
  return false;
}
function elegivelNoEvento(membroId, occ){
  const ev=db.eventos.find(e=>e.id===occ.eventoId);
  if(ev&&ev.elegiveis&&ev.elegiveis.length) return ev.elegiveis.includes(membroId);
  return true;
}
/* Disponibilidades puxadas do formulário — só valem para o mês a que se referem. */
function dispAtiva(){ return (dispMes && dispRef===chaveMes(selAno,selMes)) ? dispMes : null; }
function indisponivelOcc(membroId, occKey){ const dm=dispAtiva(); const d=dm&&dm[membroId]; return !!(d && d.indisponiveis.has(occKey)); }
function preferidoOcc(membroId, occKey){ const dm=dispAtiva(); const d=dm&&dm[membroId]; return !!(d && d.preferidos.has(occKey)); }
function rotuloOcc(occKey){ const i=occKey.indexOf('|'); const evId=occKey.slice(0,i), data=occKey.slice(i+1); const ev=db.eventos.find(e=>e.id===evId); const f=formatData(data); return `${f.sem} ${f.dm}${ev?` · ${ev.tipo}`:''}`; }
function painelFases(){
  const e=edit.fases?(db.fases||[]).find(f=>f.id===edit.fases):null;
  return `<h2 class="sec">Fases</h2>
    <p class="hint" style="margin:-4px 0 14px">Cadastre as fases do instituto e as <strong>datas de formação</strong> de cada uma. Nessas datas, ninguém daquela fase é escalado — o sistema já respeita isso ao gerar a escala. Vincule cada pessoa à sua fase pela aba <strong>Membros</strong>.</p>
    <div class="card pad form-card"><div class="field"><label>${e?'Editar fase':'Nova fase'}</label>
      <div class="formrow"><input type="text" id="campo-fase" placeholder="Nome da fase (ex.: Bento, Shemá, Abraão...)" value="${e?esc(e.nome):''}" data-enter="salvarFase" autocomplete="off">
        <button class="btn primary" data-action="salvarFase">${ico(e?'check':'plus')} ${e?'Salvar alterações':'Adicionar'}</button>
        ${e?`<button class="btn ghost" data-action="cancelEdit" data-tab="fases">Cancelar</button>`:''}</div>
      <p class="hint" style="margin-top:8px">Digite o nome e tecle Enter — o foco continua aqui para cadastrar várias em sequência.</p></div>
    ${cadHead((db.fases||[]).length)}${barraFiltro('fases','Buscar por nome da fase, data de formação ou membro...')}
    <div id="lista-fases">${listaFases()}</div>`;
}
function listaFases(){
  const fases=db.fases||[];
  if(!fases.length) return vazio('layers','Nenhuma fase ainda','Cadastre as fases (Pré-discípulos, Bento, Shemá...) para vincular membros e marcar datas de formação.');
  const q=norm(filtros.fases);
  const itens=fases.filter(fa=>{ const ds=(fa.datas||[]).map(d=>formatData(d).dmy).join(' '); const ms=db.membros.filter(m=>m.faseId===fa.id).map(m=>m.nome).join(' '); return !q||norm(`${fa.nome} ${ds} ${ms}`).includes(q); });
  if(!itens.length) return semResultado();
  return itens.map(fa=>{
    const nMembros=db.membros.filter(m=>m.faseId===fa.id).length;
    const datas=(fa.datas||[]).slice().sort();
    const chips=datas.length?datas.map(d=>`<span class="fdata-chip">${formatData(d).dm}<button data-action="delFaseData" data-id="${fa.id}" data-data="${d}" aria-label="Remover data">×</button></span>`).join(''):`<span class="small" style="color:var(--sub)">Nenhuma data de formação ainda.</span>`;
    return `<div class="fase-card">
      <div class="fase-top"><div class="grow"><div class="name fase-name">${ico('layers')} ${esc(fa.nome)}</div><div class="meta">${nMembros} ${nMembros===1?'membro':'membros'} nesta fase · ${datas.length} ${datas.length===1?'data de formação':'datas de formação'}</div></div>
        <button class="iconbtn sm" data-action="editFase" data-id="${fa.id}" aria-label="Editar">${ico('edit')}</button>
        <button class="del" data-action="delFase" data-id="${fa.id}" aria-label="Excluir">${ico('trash')}</button></div>
      <div class="fase-datas"><span class="fase-lbl">Datas de formação</span><div class="fdata-wrap">${chips}</div></div>
      <div class="fase-add"><input type="date" id="fdata-${fa.id}" class="inp-date"><button class="btn ghost sm" data-action="addFaseData" data-id="${fa.id}">${ico('plus')} Adicionar data</button></div>
    </div>`;
  }).join('');
}
function salvarFase(){
  const nome=(gv('campo-fase')||'').trim(); if(!nome) return; if(!db.fases) db.fases=[];
  if(edit.fases){
    const fa=db.fases.find(x=>x.id===edit.fases); const antigo=fa?fa.nome:'';
    pedirConfirmacao('Salvar alterações da fase', [`${antigo} → ${nome}`], async ()=>{
      if(_gravando) return; _gravando=true; try{ if(fa) fa.nome=nome; edit.fases=null; await salvar(); render(); toast('Fase atualizada'); } finally { _gravando=false; }
    });
  } else {
    pedirConfirmacao('Cadastrar nova fase', [nome], async ()=>{
      if(_gravando) return; _gravando=true; try{ db.fases.push({id:uid(), nome, datas:[]}); focusApos='campo-fase'; await salvar(); render(); toast('Fase cadastrada'); } finally { _gravando=false; }
    });
  }
}
function delFase(id){
  if(!db.fases) return; const fa=db.fases.find(x=>x.id===id); if(!fa) return;
  const nMembros=db.membros.filter(m=>m.faseId===id).length;
  pedirConfirmacao('Excluir fase', [fa.nome, nMembros?`${nMembros} membro(s) ficarão sem fase.`:'Nenhum membro vinculado.'], async ()=>{
    db.fases=db.fases.filter(x=>x.id!==id); db.membros.forEach(m=>{ if(m.faseId===id) m.faseId=null; }); if(edit.fases===id) edit.fases=null; await salvar(); render(); toast('Fase removida');
  }, 'red');
}
function addFaseData(id){
  const d=gv('fdata-'+id); if(!d){ toast('Escolha uma data'); return; }
  const fa=(db.fases||[]).find(x=>x.id===id); if(!fa) return;
  if((fa.datas||[]).includes(d)){ toast('Essa data já está cadastrada'); return; }
  pedirConfirmacao(`Adicionar data de formação — ${fa.nome}`, [formatData(d).dmy], async ()=>{
    if(_gravando) return; _gravando=true; try{ if(!fa.datas) fa.datas=[]; fa.datas.push(d); await salvar(); render(); toast('Data adicionada'); } finally { _gravando=false; }
  });
}
function delFaseData(id,data){
  const fa=(db.fases||[]).find(x=>x.id===id); if(!fa) return;
  pedirConfirmacao('Remover data de formação', [`${fa.nome} — ${formatData(data).dmy}`], async ()=>{
    fa.datas=(fa.datas||[]).filter(x=>x!==data); await salvar(); render(); toast('Data removida');
  }, 'red');
}
async function setMembroFase(id, faseId){ const m=db.membros.find(x=>x.id===id); if(!m) return; m.faseId=faseId||null; await salvar(); render(); }

/* ---------- Puxar disponibilidades (formulário -> motor) ---------- */
async function puxarDisponibilidades(){
  try{
    const ref=chaveMes(selAno,selMes);
    dispMes=await sbDisponibilidades(ref); dispRef=ref;
    render();
    toast(`${Object.keys(dispMes).length} disponibilidade(s) de ${MESES[selMes]} carregada(s)`);
  }catch(e){ console.error(e); toast('Erro ao puxar disponibilidades'); }
}
function painelDisponib(){
  const ativos=db.membros.filter(m=>m.ativo);
  const dm=dispAtiva();
  const puxar=`<div class="exp-bar xls"><span class="lbl">${ico('refresh')} Disponibilidades de ${MESES[selMes]} ${selAno}:</span><button class="btn primary" data-action="puxarDisponibilidades">${dm?'Atualizar':'Puxar'} disponibilidades</button><span class="hint" style="margin:0">lê o que os membros enviaram no link público</span></div>`;
  if(!dm) return puxar+`<p class="hint" style="margin-top:12px">Clique para carregar as respostas de <strong>${MESES[selMes]}</strong> (o mês selecionado na aba Escala). Ao gerar, elas são aplicadas automaticamente: <strong style="color:var(--red)">Não posso</strong> bloqueia a ocorrência e <strong style="color:var(--gold-deep)">Prefiro</strong> dá preferência no desempate.</p>`;
  const responderam=Object.keys(dm);
  const faltam=ativos.filter(m=>!dm[m.id]);
  const resumo=`<div class="summary"><div class="stat ok"><div class="n">${responderam.length}</div><div class="l">Responderam</div></div><div class="stat ${faltam.length?'warn':''}"><div class="n">${faltam.length}</div><div class="l">Faltam</div></div></div>`;
  const faltamHtml=faltam.length?`<div class="card pad" style="margin-bottom:12px"><strong>Ainda não responderam (${faltam.length}):</strong><div class="chips" style="margin-top:8px;padding-left:0">${faltam.map(m=>`<span class="chip rest">${esc(m.nome)}</span>`).join('')}</div></div>`:`<div class="notice" style="background:var(--green-soft);color:var(--green)">${ico('check')}<div>Todos os membros ativos responderam.</div></div>`;
  const detalhes=responderam.map(mid=>{ const d=dm[mid]; const nao=[...d.indisponiveis], pref=[...d.preferidos];
    return `<div class="row" style="align-items:flex-start"><div class="grow"><div class="name">${esc(nomeMembro(mid))}</div>
      ${nao.length?`<div class="meta" style="margin-top:4px"><strong style="color:var(--red)">Não posso:</strong> ${nao.map(k=>esc(rotuloOcc(k))).join(' · ')}</div>`:''}
      ${pref.length?`<div class="meta" style="margin-top:2px"><strong style="color:var(--gold-deep)">Prefiro:</strong> ${pref.map(k=>esc(rotuloOcc(k))).join(' · ')}</div>`:''}
      ${(!nao.length&&!pref.length)?`<div class="meta" style="margin-top:4px">Disponível em tudo.</div>`:''}
      ${d.observacoes?`<div class="meta" style="margin-top:2px;font-style:italic">"${esc(d.observacoes)}"</div>`:''}
    </div></div>`;
  }).join('');
  return puxar+resumo+faltamHtml+`<div class="cad-head"><span>Respostas</span><span class="cad-count">${responderam.length}</span></div>${detalhes}`;
}
init();
</script>
