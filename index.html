<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala da Liturgia · Instituto Beneditino em Adoração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root, :root[data-theme="light"]{
    --bg:#F1EFE8; --paper:#FFFFFF; --ink:#15233F; --sub:#6B7488;
    --line:#E4E1D8; --line2:#F0EDE6; --hover:rgba(0,37,84,.07);
    --navy:#002554; --gold:#C99036;
    --primary:#002554; --primary-d:#001B40; --primary-soft:#E5E9F1; --on-primary:#FFFFFF;
    --gold-deep:#8C6216; --gold-soft:#F4EBD7;
    --green:#2E7D52; --green-soft:#E4F0E9;
    --amber:#B06A1F; --amber-soft:#F6E9D6;
    --red:#C0392B; --red-soft:#F7E3E0;
    --shadow:0 1px 2px rgba(0,37,84,.05), 0 4px 16px rgba(0,37,84,.07);
  }
  :root[data-theme="dark"]{
    --bg:#002554; --paper:#0A3061; --ink:#EAF0F8; --sub:#9DB1CC;
    --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.06); --hover:rgba(255,255,255,.10);
    --navy:#002554; --gold:#D2A24B;
    --primary:#C99036; --primary-d:#B07E27; --primary-soft:rgba(201,144,54,.18); --on-primary:#002554;
    --gold-deep:#E2B968; --gold-soft:rgba(201,144,54,.16);
    --green:#56C08A; --green-soft:rgba(86,192,138,.16);
    --amber:#E2A648; --amber-soft:rgba(226,166,72,.16);
    --red:#F0726A; --red-soft:rgba(240,114,106,.18);
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.3);
  }
  :root{ --display:'Montserrat', -apple-system, Segoe UI, Roboto, Arial, sans-serif;
         --body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .2s, color .2s;}
  .wrap{max-width:1080px; margin:0 auto; padding:22px 20px 40px;}

  header.app{margin-bottom:18px;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand{display:flex; align-items:center; gap:14px; min-width:0;}
  .logo-img{width:58px; height:58px; border-radius:16px; border:1px solid var(--line); object-fit:cover; flex:none; box-shadow:var(--shadow);}
  .brand-txt h1{font-family:var(--display); font-weight:700; font-size:25px; letter-spacing:.2px; margin:0; line-height:1.05;}
  .brand-txt p{margin:5px 0 0; color:var(--sub); font-size:10.5px; font-weight:600; letter-spacing:1.4px;}
  .theme-toggle{flex:none; width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .theme-toggle:hover{background:var(--hover);}
  .theme-toggle svg{width:18px; height:18px;}
  .brand-rule{height:2px; background:linear-gradient(90deg, var(--gold) 0 58px, var(--line) 58px); border-radius:2px; margin-top:18px;}

  nav.tabs{display:flex; flex-wrap:wrap; gap:6px; margin:18px 0 22px; border-bottom:1px solid var(--line);}
  .tab{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border:none; background:none; cursor:pointer;
       color:var(--sub); font-family:var(--body); font-size:13.5px; font-weight:500; border-radius:9px 9px 0 0;
       border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab:hover{color:var(--ink); background:var(--line2);}
  .tab.on{color:var(--gold-deep); border-bottom-color:var(--gold); background:transparent;}
  .tab svg{width:16px;height:16px}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);}
  .pad{padding:16px 18px;}
  .grid-escala{display:grid; grid-template-columns: 1fr 320px; gap:16px; align-items:start;}
  @media (max-width:880px){ .grid-escala{grid-template-columns:1fr;} }

  h2.sec{font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:.2px; margin:0 0 12px;}
  .muted{color:var(--sub);} .small{font-size:12.5px;} .tiny{font-size:11.5px;}

  .monthbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .monthbar .mlabel{font-family:var(--display); font-size:22px; font-weight:700; letter-spacing:.2px; min-width:188px;}
  .iconbtn{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--paper); cursor:pointer; color:var(--ink);}
  .iconbtn:hover{background:var(--hover);}
  .iconbtn svg{width:17px;height:17px}
  .iconbtn.sm{width:32px; height:32px;} .iconbtn.sm svg{width:15px;height:15px}

  .btn{display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:10px; cursor:pointer; font-family:var(--body); font-size:13.5px; font-weight:600; border:1px solid transparent;}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--primary); color:var(--on-primary);}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--paper); border-color:var(--line); color:var(--ink);}
  .btn.ghost:hover{background:var(--hover);}
  .btn.gold{background:var(--gold-soft); border-color:var(--gold); color:var(--gold-deep);}
  .btn.gold:hover{filter:brightness(1.03);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .summary{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .stat{background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:9px 13px; min-width:96px;}
  .stat .n{font-family:var(--display); font-size:21px; font-weight:700; line-height:1;}
  .stat .l{font-size:11px; color:var(--sub); margin-top:4px; text-transform:uppercase; letter-spacing:.5px;}
  .stat.warn{background:var(--amber-soft); border-color:var(--amber);} .stat.warn .n{color:var(--amber);}
  .stat.ok{background:var(--green-soft); border-color:var(--green);} .stat.ok .n{color:var(--green);}

  .day{margin-bottom:18px;}
  .day-head{display:flex; align-items:baseline; gap:10px; padding-bottom:7px; margin-bottom:10px; border-bottom:1.5px solid var(--gold-soft);}
  .day-head .d-week{font-family:var(--display); font-size:14px; font-weight:700; color:var(--gold-deep); letter-spacing:.2px;}
  .day-head .d-date{font-family:var(--display); font-size:14px; font-weight:600;}
  .occ{border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:10px; background:var(--paper);}
  .occ.sel{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
  .occ.cancel{opacity:.6; background:var(--line2);}
  .occ.falta{border-color:var(--red);}
  .occ-top{display:flex; align-items:flex-start; gap:11px;}
  .occ-main{flex:1; min-width:0;}
  .occ-title{font-weight:600; font-size:15px;}
  .occ-title .type{color:var(--gold-deep);}
  .occ-meta{color:var(--sub); font-size:12.5px; margin-top:2px;}
  .occ-meta .dot{margin:0 6px; opacity:.5;}
  .occ-meta .cheg{color:var(--gold-deep); font-weight:600;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:20px; flex:none;}
  .badge.full{background:var(--green-soft); color:var(--green);}
  .badge.miss{background:var(--red-soft); color:var(--red);}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; padding-left:30px; align-items:center;}
  .chip{display:inline-flex; align-items:center; gap:6px; background:var(--primary-soft); color:var(--primary); border-radius:20px; padding:4px 6px 4px 12px; font-size:12.5px; font-weight:600;}
  :root[data-theme="dark"] .chip{color:var(--gold-deep);}
  .chip button{border:none; background:var(--hover); color:inherit; width:17px; height:17px; border-radius:50%; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:12px; line-height:1; padding:0;}
  .chip.rest{background:var(--amber-soft); color:var(--amber);}
  :root[data-theme="dark"] .chip.rest{color:var(--amber);}
  .pend-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;}
  /* vaga livre = select vermelho clicável */
  .chip-sel{font-family:var(--body); font-size:12.5px; font-weight:600; border-radius:20px; padding:5px 10px; cursor:pointer; border:1px solid var(--red); background:var(--red-soft); color:var(--red); -webkit-appearance:none; appearance:none; background-image:none;}
  .chip-sel:hover{filter:brightness(.97);}
  .addsel{margin-top:9px; padding-left:30px;}
  select.add{border:1px dashed var(--line); background:var(--paper); border-radius:9px; padding:6px 9px; font-family:var(--body); font-size:12.5px; color:var(--ink); cursor:pointer;}
  .occ-actions{margin-top:9px; padding-left:30px;}
  .linkbtn{background:none; border:none; color:var(--sub); font-size:11.5px; cursor:pointer; padding:2px 0; font-family:var(--body); text-decoration:underline; text-underline-offset:2px;}
  .linkbtn:hover{color:var(--red);}
  .linkbtn.restore:hover{color:var(--gold-deep);}

  .fair-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .fair-row .fname{width:84px; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fair-bar{flex:1; height:9px; background:var(--line2); border-radius:6px; overflow:hidden;}
  .fair-bar > span{display:block; height:100%; background:var(--gold); border-radius:6px;}
  .fair-row .fn{font-variant-numeric:tabular-nums; font-size:13px; font-weight:700; width:20px; text-align:right; color:var(--gold-deep);}
  .fair-row.off .fname{color:var(--sub);} .fair-row.off .fair-bar > span{background:var(--line);}

  .row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:11px; background:var(--paper); margin-bottom:8px;}
  .row .grow{flex:1; min-width:0;}
  .row .name{font-weight:600;}
  .row .meta{color:var(--sub); font-size:12.5px; margin-top:1px;}
  .row.muted-row{opacity:.55;}

  .switch{position:relative; width:40px; height:23px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:.15s;}
  .slider:before{content:""; position:absolute; height:17px; width:17px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch input:checked + .slider{background:var(--primary);}
  .switch input:checked + .slider:before{transform:translateX(17px);}

  .del{border:none; background:var(--red-soft); color:var(--red); width:32px; height:32px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; flex:none;}
  .del:hover{filter:brightness(.95);} .del svg{width:16px;height:16px}

  .form-card{margin-bottom:18px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--sub);}
  input[type=text], input[type=number], input[type=date], input[type=time], select.inp{
     border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-family:var(--body); font-size:14px; background:var(--paper); color:var(--ink); width:100%;}
  input::placeholder{color:var(--sub); opacity:.7;}
  input:focus, select:focus{outline:2px solid var(--primary-soft); outline-offset:0; border-color:var(--primary);}
  .formgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .formgrid .full{grid-column:1/-1;}
  @media (max-width:560px){ .formgrid{grid-template-columns:1fr;} }
  .hidden{display:none !important;}
  .nummini{width:62px;}
  .formrow{display:flex; gap:8px; flex-wrap:wrap;}
  .formrow input[type=text], .formrow input[type=date]{flex:1; min-width:160px;}

  .wd-row{display:flex; flex-wrap:wrap; gap:6px;}
  .wd{display:inline-flex; align-items:center; justify-content:center; min-width:48px; padding:7px 10px; border:1px solid var(--line); border-radius:9px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--sub); user-select:none;}
  .wd input{display:none;}
  .wd:has(input:checked){ background:var(--primary); border-color:var(--primary); color:var(--on-primary); }
  .rec-box{border:1px dashed var(--line); border-radius:11px; padding:12px; margin-top:4px; display:flex; flex-direction:column; gap:12px; background:var(--bg);}

  /* Calendário multi-seleção (restrições) */
  .cal{margin-top:4px; border:1px solid var(--line); border-radius:11px; padding:12px; background:var(--bg);}
  .cal-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-top .m{font-family:var(--display); font-weight:700; font-size:14.5px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{text-align:center; font-size:10px; font-weight:700; color:var(--sub); padding:2px 0; text-transform:uppercase; letter-spacing:.4px;}
  .cal-day{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; background:var(--paper); color:var(--ink); user-select:none;}
  .cal-day:hover{border-color:var(--primary);}
  .cal-day.blank{visibility:hidden; cursor:default;}
  .cal-day.pend{background:var(--amber); border-color:var(--amber); color:#fff;}
  .cal-day.saved{background:var(--red-soft); border-color:var(--red); color:var(--red); cursor:default;}
  .cal-day.today{outline:2px solid var(--gold);}
  .cal-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:11px; font-size:11px; color:var(--sub);}
  .cal-legend .k{display:inline-flex; align-items:center; gap:6px;}
  .cal-legend .b{width:13px; height:13px; border-radius:4px; display:inline-block; border:1px solid;}

  .cad-head{display:flex; align-items:center; gap:8px; margin:4px 0 10px; font-family:var(--display); font-weight:700; font-size:15px;}
  .cad-head .cad-count{font-family:var(--body); font-weight:600; font-size:12px; color:var(--sub); background:var(--line2); border-radius:20px; padding:1px 9px;}
  .filtro{position:relative; margin-bottom:12px;}
  .filtro .fi{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--sub); display:flex;}
  .filtro .fi svg{width:16px;height:16px}
  .filtro input{width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px 9px 35px; font-family:var(--body); font-size:13.5px; background:var(--paper); color:var(--ink);}

  .typchips{display:flex; flex-wrap:wrap; gap:7px; margin:2px 0 10px;}
  .typchip{display:inline-flex; align-items:center; gap:6px; background:var(--gold-soft); color:var(--gold-deep); border:1px solid var(--gold); border-radius:20px; padding:5px 8px 5px 13px; font-size:12.5px; font-weight:600;}
  .typchip button{border:none; background:var(--hover); color:inherit; width:17px; height:17px; border-radius:50%; cursor:pointer; font-size:12px; line-height:1; display:inline-flex; align-items:center; justify-content:center;}
  .typchip .te{cursor:pointer; display:inline-flex;} .typchip .te svg{width:12px;height:12px}

  .notice{display:flex; gap:9px; align-items:flex-start; padding:11px 13px; border-radius:11px; background:var(--amber-soft); color:var(--amber); font-size:12.5px; font-weight:500; margin-bottom:14px;}
  .notice svg{width:16px;height:16px;flex:none;margin-top:1px}

  .empty{text-align:center; padding:30px 18px; color:var(--sub);}
  .empty .ei{width:38px; height:38px; margin:0 auto 10px; color:var(--line);}
  .empty .ei svg{width:38px;height:38px}

  details.how{margin-top:14px; border:1px solid var(--line); border-radius:12px; background:var(--paper); overflow:hidden;}
  details.how summary{cursor:pointer; padding:12px 16px; font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:8px; list-style:none;}
  details.how summary::-webkit-details-marker{display:none}
  details.how summary svg{width:16px;height:16px; color:var(--gold);}
  details.how .how-body{padding:0 16px 16px; color:var(--ink); font-size:13px; line-height:1.6;}
  details.how .how-body ol{margin:6px 0 0; padding-left:20px;} details.how .how-body li{margin-bottom:6px;}

  .hint{font-size:12px; color:var(--sub);}
  .hint svg{width:15px; height:15px; flex:none; vertical-align:-2px;}
  .section-actions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .exp-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; padding:10px 12px; border:1px solid var(--line); border-radius:11px; background:var(--paper);}
  .exp-bar .lbl{font-size:12px; font-weight:700; color:var(--ink); display:inline-flex; align-items:center; gap:6px;}
  .exp-bar .lbl svg{width:15px;height:15px; color:var(--gold);}
  .exp-bar.png{border-color:var(--gold); background:var(--gold-soft);}
  .exp-bar.png .lbl{color:var(--gold-deep);}
  .exp-bar.xls{border-color:var(--green); background:var(--green-soft);}
  .exp-bar.xls .lbl{color:var(--green);} .exp-bar.xls .lbl svg{color:var(--green);}
  .selcount{font-size:12px; font-weight:600; color:var(--gold-deep);}

  footer.app{margin-top:30px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}

  #toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff; padding:11px 18px; border-radius:11px; font-size:13.5px; font-weight:500; box-shadow:0 8px 28px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.22s; display:flex; align-items:center; gap:9px; z-index:50; max-width:90vw;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast svg{width:17px;height:17px; color:var(--gold); flex:none;}
  /* baseline anti-ícone-gigante + restrições no card */
  svg{width:16px; height:16px;}
  .badge svg{width:12px; height:12px; vertical-align:-1px;}
  .badge.rest{background:var(--amber-soft); color:var(--amber);}
  .chip svg{width:13px; height:13px; vertical-align:-2px; margin-right:1px;}
  .chip.conflito{background:var(--red-soft); color:var(--red);}
  .rest-det{margin-top:9px; padding-left:30px;}
  .rest-det summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--amber);}
  .rest-det summary::-webkit-details-marker{display:none}
  .rest-det summary svg{width:13px;height:13px}
  .rest-det[open] summary{margin-bottom:8px;}
  .rest-names{display:flex; flex-wrap:wrap; gap:6px; padding-left:0;}
  /* Calendário (tela cheia) */
  .calx-top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .calx-wrap{display:grid; grid-template-columns:1fr 360px; gap:16px; align-items:start;}
  @media (max-width:880px){ .calx-wrap{grid-template-columns:1fr;} }
  .calx-cal{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--shadow);}
  .calx-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .calx-dow{text-align:center; font-size:10.5px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.4px; padding-bottom:3px;}
  .calx-empty{min-height:66px;}
  .calx-day{min-height:66px; border:1px solid var(--line); border-radius:9px; padding:5px; background:var(--bg); display:flex; flex-direction:column; gap:3px; overflow:hidden;}
  .calx-day.tem{cursor:pointer; background:var(--paper);}
  .calx-day.tem:hover{border-color:var(--primary);}
  .calx-day.sel{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
  .calx-day.hoje .calx-num{color:var(--gold-deep);}
  .calx-num{font-size:12px; font-weight:700; color:var(--ink);}
  .calx-ev{font-size:9.5px; line-height:1.25; background:var(--primary-soft); color:var(--primary); border-radius:5px; padding:2px 5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  :root[data-theme="dark"] .calx-ev{color:var(--gold-deep);}
  .calx-ev.falta{background:var(--red-soft); color:var(--red);}
  .calx-det{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow);}
  .det-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .det-day{font-family:var(--display); font-weight:700; font-size:17px;}
  .det-card{border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:10px;}
  .det-tit{font-weight:600; font-size:15px;} .det-tit .type{color:var(--gold-deep);}
  .det-meta{font-size:12.5px; color:var(--sub); margin-top:3px;}
  .det-meta b{color:var(--ink); font-weight:700;}
  .det-obs{font-size:12.5px; color:var(--sub); margin-top:5px; font-style:italic;}
  .det-nomes{margin:9px 0 0; padding-left:18px;} .det-nomes li{font-size:13.5px; margin-bottom:2px;}
  /* Prévia em tela */
  .pv-grp{margin-bottom:14px;}
  .pv-h{font-family:var(--display); font-weight:700; font-size:14px; color:var(--gold-deep); padding-bottom:5px; margin-bottom:8px; border-bottom:1.5px solid var(--gold-soft);}
  .pv-row{padding:7px 0; border-bottom:1px dashed var(--line2);}
  .pv-t{font-weight:600; font-size:13.5px;}
  .pv-n{font-size:13px; color:var(--ink); margin-top:2px;}
  .pv-o{font-size:12px; color:var(--sub); font-style:italic; margin-top:2px;}
  /* ===== Manual embutido ===== */
  .man-wrap{ max-width:870px; margin:0 auto; }
  .man-hero{ background:linear-gradient(150deg,var(--primary) 0%, #001a3d 100%); border-radius:16px; padding:26px 30px; color:#fff; margin-bottom:6px; position:relative; overflow:hidden; }
  .man-hero::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:var(--gold); }
  .man-hero .kick{ font-family:var(--display); font-weight:600; letter-spacing:2px; text-transform:uppercase; font-size:11px; color:#EBD9B4; }
  .man-hero h1{ font-family:var(--display); font-weight:800; font-size:26px; margin:8px 0 7px; line-height:1.12; }
  .man-hero p{ margin:0; font-size:14px; color:#d4def0; max-width:62ch; line-height:1.5; }
  .man-actions{ margin-top:16px; }
  .man-print-btn{ background:var(--gold); color:#241803; border:none; font-family:var(--display); font-weight:700; font-size:13px; padding:9px 17px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .man-print-btn:hover{ filter:brightness(1.05); }
  .man-print-btn svg{ width:16px; height:16px; }
  .man-sec{ margin:24px 0; }
  .man-sec-head{ display:flex; align-items:center; gap:11px; border-bottom:2px solid var(--gold); padding-bottom:7px; margin-bottom:13px; }
  .man-num{ background:var(--primary); color:#fff; font-family:var(--display); font-weight:700; font-size:14px; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
  .man-sec-head h2{ font-family:var(--display); font-weight:700; font-size:19px; color:var(--ink); margin:0; line-height:1.15; }
  .man-wrap h3{ font-family:var(--display); font-weight:700; font-size:15px; color:var(--primary); margin:15px 0 5px; }
  :root[data-theme="dark"] .man-wrap h3{ color:var(--gold-deep); }
  .man-wrap h4{ font-family:var(--display); font-weight:700; font-size:13px; color:var(--gold-deep); margin:13px 0 3px; }
  .man-wrap p{ margin:0 0 8px; line-height:1.6; font-size:14px; }
  .man-lead{ font-size:15px !important; color:var(--sub); line-height:1.55; }
  .man-wrap ul,.man-wrap ol{ margin:0 0 10px; padding-left:20px; line-height:1.6; font-size:14px; }
  .man-wrap li{ margin-bottom:5px; }
  .man-steps{ counter-reset:ms; list-style:none; padding-left:0; }
  .man-steps>li{ counter-increment:ms; position:relative; padding-left:33px; margin-bottom:8px; }
  .man-steps>li::before{ content:counter(ms); position:absolute; left:0; top:0; width:23px; height:23px; border-radius:50%; background:var(--gold-soft); color:var(--gold-deep); font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; font-family:var(--display); }
  .man-wrap strong{ color:var(--ink); font-weight:600; }
  .man-ui{ background:var(--primary); color:#fff; font-weight:600; font-size:11.5px; padding:1px 8px; border-radius:6px; white-space:nowrap; display:inline-block; line-height:1.5; }
  .man-ui.red{ background:var(--red); }
  .man-tab{ border:1.5px solid var(--gold); color:var(--gold-deep); font-weight:600; font-size:11.5px; padding:0 8px; border-radius:20px; white-space:nowrap; display:inline-block; line-height:1.6; }
  .man-fld{ background:var(--primary-soft); color:var(--primary); font-weight:600; font-size:11.5px; padding:0 6px; border-radius:5px; border:1px solid var(--line); white-space:nowrap; display:inline-block; line-height:1.5; }
  :root[data-theme="dark"] .man-fld{ color:var(--gold-deep); }
  .man-box{ border-radius:10px; padding:11px 14px; margin:12px 0; border-left:4px solid; font-size:13.5px; line-height:1.55; }
  .man-box .bt{ font-family:var(--display); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:3px; }
  .man-nota{ background:var(--primary-soft); border-color:var(--primary); } .man-nota .bt{ color:var(--primary); }
  :root[data-theme="dark"] .man-nota .bt{ color:var(--gold-deep); }
  .man-dica{ background:var(--gold-soft); border-color:var(--gold); } .man-dica .bt{ color:var(--gold-deep); }
  .man-aten{ background:var(--red-soft); border-color:var(--red); } .man-aten .bt{ color:var(--red); }
  .man-table{ width:100%; border-collapse:collapse; margin:10px 0 12px; font-size:13px; }
  .man-table th{ background:var(--primary); color:#fff; text-align:left; font-family:var(--display); font-weight:600; font-size:12px; padding:7px 10px; }
  .man-table td{ padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.5; }
  .man-table tr:nth-child(even) td{ background:var(--bg); }
  .man-table.k td:first-child{ font-weight:600; color:var(--primary); white-space:nowrap; }
  :root[data-theme="dark"] .man-table.k td:first-child{ color:var(--gold-deep); }
  @media print{
    @page{ margin:14mm 12mm; }
    body{ background:#fff !important; }
    body *{ visibility:hidden; }
    .man-wrap, .man-wrap *{ visibility:visible; }
    .man-wrap{ position:absolute; left:0; top:0; width:100%; max-width:none; margin:0; padding:0; }
    .man-noprint{ display:none !important; }
    .man-sec, .man-box, .man-table{ break-inside:avoid; }
    .man-sec-head, .man-wrap h3, .man-wrap h4{ break-after:avoid; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }
  /* ===== Trocar / transferir membros ===== */
  .mvh{ display:inline-flex; align-items:center; opacity:.45; margin-right:1px; }
  .mvh svg{ width:11px; height:11px; }
  .chip.movel{ cursor:pointer; }
  .chip.movel:hover{ outline:2px solid var(--primary); outline-offset:1px; }
  .chip.pegando{ outline:2px solid var(--gold); outline-offset:1px; background:var(--gold-soft); color:var(--gold-deep); }
  .chip.pegando .mvh{ opacity:1; }
  .drop-btn{ display:inline-flex; align-items:center; gap:6px; margin:8px 0 0 30px; background:var(--primary-soft); color:var(--primary); border:1.5px dashed var(--primary); border-radius:8px; padding:6px 12px; font-weight:600; font-size:12.5px; cursor:pointer; }
  .drop-btn svg{ width:14px; height:14px; }
  .drop-btn:hover{ background:var(--primary); color:#fff; }
  :root[data-theme="dark"] .drop-btn{ color:var(--gold-deep); }
  :root[data-theme="dark"] .drop-btn:hover{ color:#fff; }
  .mover-banner{ position:sticky; top:8px; z-index:6; display:flex; align-items:center; gap:11px; background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:11px; padding:10px 14px; margin-bottom:13px; box-shadow:var(--shadow); }
  .mover-banner svg{ color:var(--gold-deep); flex:none; width:18px; height:18px; }
  .mover-banner > div{ font-size:13px; line-height:1.45; }
  .mover-banner .linkbtn{ margin-left:auto; white-space:nowrap; font-weight:600; }
  /* ===== Fases ===== */
  .fase-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:11px; box-shadow:var(--shadow); }
  .fase-top{ display:flex; align-items:flex-start; gap:8px; }
  .fase-name{ display:inline-flex; align-items:center; gap:7px; }
  .fase-name svg{ width:16px; height:16px; color:var(--primary); }
  .fase-datas{ margin-top:11px; padding-top:11px; border-top:1px dashed var(--line); }
  .fase-lbl{ display:block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--sub); margin-bottom:7px; }
  .fdata-wrap{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .fdata-chip{ display:inline-flex; align-items:center; gap:5px; background:var(--gold-soft); color:var(--gold-deep); border:1px solid var(--gold); border-radius:8px; padding:4px 6px 4px 10px; font-size:12.5px; font-weight:600; }
  .fdata-chip button{ border:none; background:transparent; color:inherit; cursor:pointer; font-size:15px; line-height:1; padding:0 2px; opacity:.7; }
  .fdata-chip button:hover{ opacity:1; }
  .fase-add{ display:flex; gap:8px; align-items:center; margin-top:11px; }
  .inp-date{ border:1px solid var(--line); border-radius:9px; padding:7px 10px; font:inherit; font-size:13px; color:var(--ink); background:var(--paper); }
  .btn.sm{ padding:7px 11px; font-size:12.5px; }
  .fase-sel{ border:1px solid var(--line); border-radius:9px; padding:6px 9px; font:inherit; font-size:12.5px; color:var(--ink); background:var(--paper); max-width:140px; cursor:pointer; }
  .meta-fase{ display:inline-flex; align-items:center; gap:4px; color:var(--gold-deep); font-weight:600; }
  .meta-fase svg{ width:11px; height:11px; }
  /* ===== Sub-abas (Eventos/Tipos, Restrições) ===== */
  .subtabs{ display:flex; gap:6px; margin:-2px 0 16px; flex-wrap:wrap; }
  .subtab{ display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--line); color:var(--sub); border-radius:9px; padding:7px 13px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .subtab svg{ width:14px; height:14px; }
  .subtab:hover{ background:var(--hover); }
  .subtab.on{ background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
  /* ===== Elegibilidade (quem pode servir) ===== */
  .elig-row{ display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; }
  .elig{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12.5px; cursor:pointer; user-select:none; background:var(--paper); }
  .elig:hover{ border-color:var(--primary); }
  .elig input{ cursor:pointer; }
  .elig-tag{ display:inline-flex; align-items:center; gap:4px; color:var(--gold-deep); font-weight:600; }
  .elig-tag svg{ width:11px; height:11px; }
  /* ===== Calendário compacto (Restrições) ===== */
  .cal-mini{ max-width:348px; }
  .cal-mini .cal-grid{ gap:4px; }
  .cal-mini .cal-day{ font-size:12.5px; border-radius:7px; }
  /* ===== Modal de confirmação (incluir/alterar/excluir) ===== */
  .modalbg{ position:fixed; inset:0; background:rgba(10,18,36,.55); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modalcard{ background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:20px 22px; max-width:440px; width:100%; max-height:80vh; overflow:auto; }
  .modalcard h3{ font-family:var(--display); font-weight:700; font-size:17px; margin:0 0 13px; }
  .modal-linhas{ margin:0 0 18px; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
  .modal-linhas li{ font-size:13.5px; color:var(--ink); padding:8px 11px; background:var(--bg); border-radius:8px; border:1px solid var(--line); }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
</style>

<!-- Overlay de acesso do coordenador (e-mail + senha) -->
<div id="loginOverlay" style="display:none; position:fixed; inset:0; background:#F1EFE8; z-index:9999; align-items:center; justify-content:center; padding:20px; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;">
  <div style="max-width:380px; width:100%; background:#fff; border:1px solid #E4E1D8; border-radius:16px; padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.1);">
    <h2 style="margin:0 0 6px; font-size:19px; color:#15233F; text-align:center;">Escala da Liturgia</h2>

    <!-- Painel 1: login -->
    <div id="painelLogin">
      <p style="margin:0 0 18px; color:#6B7488; font-size:14px; text-align:center;">Acesso do coordenador.</p>
      <input id="loginEmail" type="email" placeholder="seu@email.com" autocomplete="email" style="width:100%; box-sizing:border-box; border:1px solid #E4E1D8; border-radius:10px; padding:11px 13px; font:inherit; font-size:15px; margin-bottom:10px;">
      <input id="loginSenha" type="password" placeholder="Senha" autocomplete="current-password" style="width:100%; box-sizing:border-box; border:1px solid #E4E1D8; border-radius:10px; padding:11px 13px; font:inherit; font-size:15px; margin-bottom:10px;">
      <button id="loginBtn" style="width:100%; background:#002554; color:#fff; border:none; border-radius:10px; padding:12px; font:inherit; font-size:15px; font-weight:600; cursor:pointer;">Entrar</button>
      <p style="margin:12px 0 0; text-align:center;"><a id="linkEsqueci" href="#" style="color:#8C6216; font-size:13px; text-decoration:none;">Esqueci minha senha</a></p>
    </div>

    <!-- Painel 2: definir/criar senha (convite, reset ou troca) -->
    <div id="painelSenha" style="display:none;">
      <p style="margin:0 0 18px; color:#6B7488; font-size:14px; text-align:center;">Crie sua nova senha de acesso.</p>
      <input id="novaSenha" type="password" placeholder="Nova senha (mín. 8 caracteres)" autocomplete="new-password" style="width:100%; box-sizing:border-box; border:1px solid #E4E1D8; border-radius:10px; padding:11px 13px; font:inherit; font-size:15px; margin-bottom:10px;">
      <input id="novaSenha2" type="password" placeholder="Repita a nova senha" autocomplete="new-password" style="width:100%; box-sizing:border-box; border:1px solid #E4E1D8; border-radius:10px; padding:11px 13px; font:inherit; font-size:15px; margin-bottom:10px;">
      <button id="salvarSenhaBtn" style="width:100%; background:#002554; color:#fff; border:none; border-radius:10px; padding:12px; font:inherit; font-size:15px; font-weight:600; cursor:pointer;">Salvar senha e entrar</button>
    </div>

    <p id="loginMsg" style="margin:12px 0 0; font-size:13px; color:#6B7488; min-height:18px; text-align:center;"></p>
  </div>
</div>
  <div class="wrap" id="app"></div>

const DSEMA=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
const pad=n=>String(n).padStart(2,'0');
const iso=(a,m,d)=>`${a}-${pad(m+1)}-${pad(d)}`;
const diasDoMes=(a,m)=>new Date(a,m+1,0).getDate();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function dataPartes(s){ const p=s.split('-').map(Number); const dt=new Date(p[0],p[1]-1,p[2]); return {dia:p[2],mes:p[1],ano:p[0],wd:dt.getDay()}; }
function formatData(s){ const p=dataPartes(s); return {sem:DSEMA[p.wd], semFull:DSEM[p.wd], dm:`${pad(p.dia)}/${pad(p.mes)}`, dmy:`${pad(p.dia)}/${pad(p.mes)}/${p.ano}`}; }
function addDias(s,n){ const p=s.split('-').map(Number); const d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()+n); return iso(d.getFullYear(),d.getMonth(),d.getDate()); }
function parseBR(s){ const m=String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return null; return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`; }

/* Horários / janelas de tempo */
function inicioMin(o){ if(!o.horario) return null; const [h,m]=o.horario.split(':').map(Number); return h*60+m; }
function horaDeslocada(horario, mins){ if(!horario) return ''; const [h,m]=horario.split(':').map(Number); let tot=(h*60+m+mins)%1440; if(tot<0) tot+=1440; return `${pad(Math.floor(tot/60))}:${pad(tot%60)}`; }
function somaHora(horario, dur){ return horaDeslocada(horario, dur||60); }
function diffMin(ini, fim){ if(!ini||!fim) return 90; const [a,b]=ini.split(':').map(Number); const [c,d]=fim.split(':').map(Number); const m=(c*60+d)-(a*60+b); return m>0?m:90; }
function intervalo(o){ return o.horario ? `${o.horario}–${somaHora(o.horario,o.duracao)}` : 'sem horário'; }
function intervaloAscii(o){ return o.horario ? `${o.horario}-${somaHora(o.horario,o.duracao)}` : ''; }

/* Posição no mês (ex.: 3ª sexta) */
function ordinalSemana(dateStr){ const [y,m,dd]=dateStr.split('-').map(Number); const wd=new Date(y,m-1,dd).getDay(); const dim=new Date(y,m,0).getDate(); const occ=[]; for(let d=1;d<=dim;d++) if(new Date(y,m-1,d).getDay()===wd) occ.push(d); const pos=occ.indexOf(dd); return pos===occ.length-1 ? 5 : pos+1; }
function nthWeekdayOfMonth(y,m,wd,ordinal){ const dim=new Date(y,m+1,0).getDate(); const days=[]; for(let d=1;d<=dim;d++) if(new Date(y,m,d).getDay()===wd) days.push(d); const idx=ordinal>=5?days.length-1:ordinal-1; if(idx<0||idx>=days.length) return null; return days[idx]; }
const ehFeminino=wd=>wd>=1&&wd<=5;
function ordinalLabel(ord, fem){ const f={1:'1ª',2:'2ª',3:'3ª',4:'4ª',5:'última'}, m={1:'1º',2:'2º',3:'3º',4:'4º',5:'último'}; return (fem?f:m)[ord]; }

/* =========================================================================
   RECORRÊNCIA (estilo Google Calendar)
   evento: { dataInicio, freq:'naoRepete|diario|semanal|mensal|anual',
             intervalo, diasSemana:[..], modoMensal:'dia|posicao',
             fim:{tipo:'nunca|ate|apos', ate, apos} }
   ========================================================================= */
function iterarOcorrencias(ev, cb){
  const inicio=ev.dataInicio; if(!inicio) return;
  const freq=ev.freq||'naoRepete'; const passo=Math.max(1, ev.intervalo||1);
  const fim=ev.fim||{tipo:'nunca'}; const CAP=8000; let idx=0;
  function emit(ds){ if(fim.tipo==='ate'&&fim.ate&&ds>fim.ate) return false; idx++; if(cb(ds, idx)===false) return false; if(fim.tipo==='apos'&&fim.apos&&idx>=fim.apos) return false; return true; }
  if(freq==='naoRepete'){ emit(inicio); return; }
  if(freq==='diario'){ let d=inicio,n=0; while(n++<CAP){ if(!emit(d)) return; d=addDias(d,passo); } return; }
  if(freq==='semanal'){
    const dias=(ev.diasSemana&&ev.diasSemana.length)?ev.diasSemana.slice().sort((a,b)=>a-b):[dataPartes(inicio).wd];
    const p=inicio.split('-').map(Number); const ws=new Date(p[0],p[1]-1,p[2]); ws.setDate(ws.getDate()-ws.getDay());
    let n=0; while(n++<CAP){ for(const wd of dias){ const dt=new Date(ws); dt.setDate(dt.getDate()+wd); const ds=iso(dt.getFullYear(),dt.getMonth(),dt.getDate()); if(ds>=inicio){ if(!emit(ds)) return; } } ws.setDate(ws.getDate()+7*passo); } return;
  }
  if(freq==='mensal'){
    const [y,m,dd]=inicio.split('-').map(Number); const modo=ev.modoMensal||'dia';
    const wd=dataPartes(inicio).wd, ord=ordinalSemana(inicio); let cur=new Date(y,m-1,1), n=0;
    while(n++<CAP){ const yy=cur.getFullYear(), mm=cur.getMonth(); let day=null;
      if(modo==='posicao') day=nthWeekdayOfMonth(yy,mm,wd,ord);
      else { const dim=new Date(yy,mm+1,0).getDate(); if(dd<=dim) day=dd; }
      if(day){ const ds=iso(yy,mm,day); if(ds>=inicio){ if(!emit(ds)) return; } }
      cur.setMonth(cur.getMonth()+passo);
    } return;
  }
  if(freq==='anual'){ const [y,m,dd]=inicio.split('-').map(Number); let yy=y,n=0; while(n++<CAP){ const dim=new Date(yy,m,0).getDate(); if(dd<=dim){ const ds=iso(yy,m-1,dd); if(ds>=inicio){ if(!emit(ds)) return; } } yy+=passo; } return; }
}
function ocorrenciasNoMes(ev, ano, mes){
  const monthStart=iso(ano,mes,1), monthEnd=iso(ano,mes,diasDoMes(ano,mes)); const out=[];
  iterarOcorrencias(ev, ds=>{ if(ds>monthEnd) return false; if(ds>=monthStart) out.push(ds); return true; });
  return out;
}
function construirOccs(ano, mes){
  const occs=[];
  for(const ev of db.eventos){ for(const data of ocorrenciasNoMes(ev,ano,mes)){ const cancelada=db.excecoes.some(e=>e.eventoId===ev.id&&e.data===data&&e.acao==='cancelar'); occs.push({key:`${ev.id}|${data}`,eventoId:ev.id,data,horario:ev.horario,chegada:ev.horarioChegada||horaDeslocada(ev.horario,-60),duracao:ev.duracao||60,vagas:ev.vagas,tipo:ev.tipo,localId:ev.localId,obs:ev.obs,cancelada}); } }
  occs.sort((a,b)=> a.data===b.data?(a.horario||'').localeCompare(b.horario||''):a.data.localeCompare(b.data));
  return occs;
}
function recorrenciaTexto(ev){
  const freq=ev.freq||'naoRepete';
  if(freq==='naoRepete'){ const f=ev.dataInicio?formatData(ev.dataInicio):null; return f?`Não repete · ${f.sem} ${f.dm}`:'Não repete'; }
  const n=Math.max(1,ev.intervalo||1); const dp=dataPartes(ev.dataInicio||hojeISO()); let base='';
  if(freq==='diario') base=n===1?'Todo dia':`A cada ${n} dias`;
  else if(freq==='semanal'){ const dias=(ev.diasSemana||[]).slice().sort((a,b)=>a-b).map(d=>DSEMA[d]).join(', '); base=(n===1?'Toda semana':`A cada ${n} semanas`)+(dias?`: ${dias}`:''); }
  else if(freq==='mensal'){ if((ev.modoMensal||'dia')==='posicao'){ const ord=ordinalSemana(ev.dataInicio); base=(n===1?'Todo mês':`A cada ${n} meses`)+` na ${ordinalLabel(ord,ehFeminino(dp.wd))} ${DSEM[dp.wd]}`; } else { base=(n===1?'Todo mês':`A cada ${n} meses`)+` no dia ${dp.dia}`; } }
  else if(freq==='anual'){ base=(n===1?'Todo ano':`A cada ${n} anos`)+` em ${pad(dp.dia)}/${pad(dp.mes)}`; }
  const fim=ev.fim||{tipo:'nunca'}; let suf='';
  if(fim.tipo==='ate'&&fim.ate){ suf=` · até ${formatData(fim.ate).dm}`; }
  else if(fim.tipo==='apos'&&fim.apos){ suf=` · ${fim.apos}×`; }
  return base+suf;
}

/* =========================================================================
   NÚCLEO — créditos, conflito de horário, alocação
   ========================================================================= */
function creditosBase(exceto){ const c={}; for(const id in (db.ajustes||{})) c[id]=db.ajustes[id]||0; for(const [chave,e] of Object.entries(db.escalasSalvas||{})){ if(chave===exceto) continue; for(const ids of Object.values(e.atribuicoes||{})) ids.forEach(id=>{ c[id]=(c[id]||0)+1; }); } return c; }
const creditosTotais=()=>creditosBase(null);
function conflita(a,b){ return a.data===b.data; } /* regra: no máximo 1 serviço por pessoa por dia */
function ocupado(atrib, occs, membroId, alvo){ for(const o of occs){ if(o.key===alvo.key) continue; if((atrib[o.key]||[]).includes(membroId) && conflita(o, alvo)) return true; } return false; }
function alocar(occs, ano, mes, chave){
  const ativos=db.membros.filter(m=>m.ativo); const base=creditosBase(chave); const credito={}, ultimo={};
  ativos.forEach(m=>{ credito[m.id]=base[m.id]||0; ultimo[m.id]=''; });
  const atrib={};
  for(const o of occs){ if(o.cancelada) continue;
    const cand=ativos.filter(m=> !restritoNoDia(m.id,o.data) && !indisponivelOcc(m.id,o.key) && elegivelNoEvento(m.id,o) && !ocupado(atrib,occs,m.id,o));
    cand.sort((a,b)=>{
      const ma=credito[a.id]-(base[a.id]||0), mb=credito[b.id]-(base[b.id]||0);
      if(ma!==mb) return ma-mb;                                                       // 1) menos serviços ESTE mês (justiça vem primeiro)
      const pa=preferidoOcc(a.id,o.key)?0:1, pb=preferidoOcc(b.id,o.key)?0:1;
      if(pa!==pb) return pa-pb;                                                        // 2) empurrãozinho: quem PREFERE entra antes, só no empate de carga
      if((base[a.id]||0)!==(base[b.id]||0)) return (base[a.id]||0)-(base[b.id]||0);   // 3) FIFO entre meses
      return (ultimo[a.id]||'').localeCompare(ultimo[b.id]||'');                      // 4) FIFO por recência
    });
    const esc=cand.slice(0,o.vagas).map(m=>m.id); atrib[o.key]=esc; esc.forEach(id=>{ credito[id]++; ultimo[id]=o.data; });
  }
  return atrib;
}
function disponiveis(o, atrib, occs){ return db.membros.filter(m=> m.ativo && !(atrib[o.key]||[]).includes(m.id) && !restritoNoDia(m.id,o.data) && !indisponivelOcc(m.id,o.key) && elegivelNoEvento(m.id,o) && !ocupado(atrib,occs,m.id,o)); }
function atribuicoesDoMes(){
  const chave=chaveMes(selAno,selMes);
  if(escalaAtual && escalaAtual.chave===chave && Object.keys(escalaAtual.atribuicoes).length) return {occs:construirOccs(selAno,selMes), atrib:escalaAtual.atribuicoes};
  const occs=construirOccs(selAno,selMes); return {occs, atrib:alocar(occs,selAno,selMes,chave)};
}

function salvarLocal(){
  const nome=(gv('campo-local')||'').trim(); if(!nome) return;
  if(edit.locais){
    const l=db.locais.find(x=>x.id===edit.locais); const antigo=l?l.nome:'';
    pedirConfirmacao('Salvar alterações do local', [`${antigo} → ${nome}`], async ()=>{
      if(_gravando) return; _gravando=true; try{ if(l) l.nome=nome; edit.locais=null; await salvar(); render(); toast('Local atualizado'); } finally { _gravando=false; }
    });
  } else {
    pedirConfirmacao('Cadastrar novo local', [nome], async ()=>{
      if(_gravando) return; _gravando=true; try{ db.locais.push({id:uid(),nome}); focusApos='campo-local'; await salvar(); render(); toast('Local cadastrado'); } finally { _gravando=false; }
    });
  }
}
function delLocal(id){
  if(db.eventos.some(e=>e.localId===id)){ toast('Há eventos usando este local'); return; }
  const l=db.locais.find(x=>x.id===id); if(!l) return;
  pedirConfirmacao('Excluir local', [l.nome], async ()=>{
    db.locais=db.locais.filter(x=>x.id!==id); if(edit.locais===id) edit.locais=null; await salvar(); render(); toast('Local excluído');
  }, 'red');
}

/* Tipos */
function salvarTipo(){
  const t=(gv('campo-tipo')||'').trim(); if(!t) return;
  if(edit.tipos!=null){
    const old=edit.tipos;
    pedirConfirmacao('Salvar alterações do tipo', [`${old} → ${t}`, 'Eventos que usam este tipo são atualizados também.'], async ()=>{
      if(_gravando) return; _gravando=true; try{ const idx=db.tipos.indexOf(old); if(idx>=0) db.tipos[idx]=t; db.eventos.forEach(e=>{ if(e.tipo===old) e.tipo=t; }); edit.tipos=null; const i=document.getElementById('campo-tipo'); if(i) i.value=''; await salvar(); render(); toast('Tipo atualizado'); } finally { _gravando=false; }
    });
  } else {
    pedirConfirmacao('Cadastrar novo tipo', [t], async ()=>{
      if(_gravando) return; _gravando=true; try{ if(!db.tipos.includes(t)) db.tipos.push(t); focusApos='campo-tipo'; const i=document.getElementById('campo-tipo'); if(i) i.value=''; await salvar(); render(); toast('Tipo cadastrado'); } finally { _gravando=false; }
    });

}
function delTipo(t){

    db.tipos=db.tipos.filter(x=>x!==t); if(edit.tipos===t) edit.tipos=null; await salvar(); render(); toast('Tipo excluído');

}
function opcoesTipo(sel){ return `<option value="" disabled ${sel?'':'selected'}>— escolha o tipo —</option>`+db.tipos.map(t=>`<option ${sel===t?'selected':''}>${esc(t)}</option>`).join('')+`<option value="__novo__">➕ Cadastrar novo tipo…</option>`; }
async function criarTipoInline(){

function cancelarTipoNovo(){ const w=document.getElementById('ev-tipo-novo-wrap'); if(w) w.classList.add('hidden'); const inp=document.getElementById('ev-tipo-novo'); if(inp) inp.value=''; const sel=document.getElementById('ev-tipo'); if(sel && sel.value==='__novo__'){ sel.value=db.tipos[0]||''; } }

/* Restrições — calendário multi-seleção + lote por membro */

function calNav(delta){ if(restricaoCalAno==null){ restricaoCalAno=selAno; restricaoCalMes=selMes; } const d=new Date(restricaoCalAno, restricaoCalMes+delta, 1); restricaoCalAno=d.getFullYear(); restricaoCalMes=d.getMonth(); render(); }
function toggleDiaRestricao(ds){ if(!restricaoMembro) return; if(db.restricoes.some(r=>r.membroId===restricaoMembro&&r.data===ds)) return; if(restricoesPendentes.includes(ds)) restricoesPendentes=restricoesPendentes.filter(x=>x!==ds); else restricoesPendentes.push(ds); render(); }
function remDataPendente(d){ restricoesPendentes=restricoesPendentes.filter(x=>x!==d); render(); }
function salvarRestricoes(){
  if(!restricaoMembro){ toast('Escolha o membro'); return; }
  if(!restricoesPendentes.length){ toast('Marque ao menos uma data'); return; }

  pedirConfirmacao(`Marcar restrição para ${nome}`, linhas, async ()=>{
    if(_gravando) return; _gravando=true; try{
      let add=0,dup=0;
      for(const d of restricoesPendentes){ if(db.restricoes.some(r=>r.membroId===restricaoMembro&&r.data===d)){ dup++; continue; } db.restricoes.push({id:uid(),membroId:restricaoMembro,data:d}); add++; }

function addMaisRestricoes(mid){ restricaoMembro=mid; restricoesPendentes=[]; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function delRestricao(id){

/* Eventos */
function lerFormEvento(){
  const tipo=gv('ev-tipo'), localId=gv('ev-local'), dataInicio=gv('ev-dataInicio');
  const horario=gv('ev-horario'); let chegada=gv('ev-chegada'); if(!chegada) chegada=horaDeslocada(horario,-60);
  const termino=gv('ev-termino'); const duracao=diffMin(horario, termino); const vagas=Math.max(1,gi('ev-vagas',1));
  const obs=(gv('ev-obs')||'').trim(); const freq=gv('ev-freq');
  if(!tipo||tipo==='__novo__'||!localId){ toast('Escolha (ou crie) um tipo e um local'); return null; }
  if(!dataInicio){ toast('Informe a data de início'); return null; }
  const ev={tipo,localId,dataInicio,horario,horarioChegada:chegada,duracao,vagas,obs,freq};
  if(freq!=='naoRepete'){
    ev.intervalo=Math.max(1,gi('ev-intervalo',1));
    const ft=gv('ev-fimTipo')||'nunca'; ev.fim={tipo:ft, ate:null, apos:null};
    if(ft==='ate'){ const ate=gv('ev-fimAte'); if(!ate){ toast('Informe a data final (Termina em)'); return null; } ev.fim.ate=ate; }
    if(ft==='apos'){ ev.fim.apos=Math.max(1,gi('ev-fimApos',1)); }
  } else { ev.intervalo=1; ev.fim={tipo:'nunca'}; }
  if(freq==='semanal'){ let dias=[...document.querySelectorAll('[data-wd]:checked')].map(c=>parseInt(c.value,10)); if(!dias.length) dias=[dataPartes(dataInicio).wd]; ev.diasSemana=dias.sort((a,b)=>a-b); }
  if(freq==='mensal'){ ev.modoMensal=gv('ev-mensalModo')||'dia'; }
  const elig=[...document.querySelectorAll('[data-elig]:checked')].map(c=>c.value); if(elig.length) ev.elegiveis=elig;
  return ev;
}
function resumoEvento(d){
  const linhas=[`${d.tipo} · ${nomeLocal(d.localId)}`, recorrenciaTexto(d)];
  if(d.horario) linhas.push(`${intervalo({horario:d.horario,duracao:d.duracao})}${d.horarioChegada?` · chegar ${d.horarioChegada}`:''}`);
  linhas.push(`${d.vagas} ${d.vagas>1?'pessoas':'pessoa'}`);
  if(d.obs) linhas.push(`Obs: ${d.obs}`);
  if(d.elegiveis&&d.elegiveis.length) linhas.push(`Só: ${d.elegiveis.map(nomeMembro).join(', ')}`);
  return linhas;
}
function salvarEvento(){
  const d=lerFormEvento(); if(!d) return;
  const dupId=edit.eventos||null;
  if(db.eventos.some(x=> x.id!==dupId && x.tipo===d.tipo && x.localId===d.localId && (x.horario||'')===(d.horario||''))){ toast('Já existe um evento com o mesmo tipo, local e horário'); return; }
  const editando=!!edit.eventos;
  pedirConfirmacao(editando?'Salvar alterações do evento':'Cadastrar novo evento', resumoEvento(d), async ()=>{
    if(_gravando) return; _gravando=true; try{
      if(editando){ const ev=db.eventos.find(x=>x.id===edit.eventos); if(ev){ const keep=ev.id; for(const k of Object.keys(ev)) delete ev[k]; Object.assign(ev,{id:keep},d); } edit.eventos=null; toast('Evento atualizado'); }
      else { db.eventos.push({id:uid(),...d}); toast('Evento cadastrado'); }
      await salvar(); render();
    } finally { _gravando=false; }
  });
}
function delEvento(id){
  const ev=db.eventos.find(x=>x.id===id); if(!ev) return;
  pedirConfirmacao('Excluir evento', [`${ev.tipo} · ${nomeLocal(ev.localId)}`, recorrenciaTexto(ev), 'Remove também as exceções (dias cancelados) deste evento.'], async ()=>{
    db.eventos=db.eventos.filter(x=>x.id!==id); db.excecoes=db.excecoes.filter(e=>e.eventoId!==id); if(edit.eventos===id) edit.eventos=null; await salvar(); render(); toast('Evento excluído');
  }, 'red');
}

/* =========================================================================
   PLANILHA EXCEL — exportar disponibilidade e importar restrições
   ========================================================================= */
function exportarPlanilha(){
  if(typeof XLSX==='undefined'){ toast('Biblioteca de Excel indisponível'); return; }
  if(restricaoCalAno==null){ restricaoCalAno=selAno; restricaoCalMes=selMes; }
  const ano=restricaoCalAno, mes=restricaoCalMes;
  const occs=construirOccs(ano,mes).filter(o=>!o.cancelada);
  if(!occs.length){ toast('Nenhum evento neste mês para exportar'); return; }
  const membros=db.membros.filter(m=>m.ativo);
  if(!membros.length){ toast('Cadastre membros antes de exportar'); return; }
  const header=['Data','Dia','Evento','Local','Horário', ...membros.map(m=>m.nome)];
  const aoa=[
    [`Disponibilidade — ${MESES[mes]} ${ano} · Instituto Beneditino em Adoração`],
    ['Em cada coluna de membro, escreva POSSO SERVIR ou NÃO POSSO SERVIR (já vem POSSO por padrão). Não altere as colunas Data/Evento.'],
    [],
    header
  ];
  occs.forEach(o=>{ const f=formatData(o.data); aoa.push([ f.dmy, f.semFull, o.tipo, nomeLocal(o.localId), o.horario||'', ...membros.map(()=> 'POSSO SERVIR') ]); });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:12},{wch:9},{wch:16},{wch:20},{wch:9}, ...membros.map(()=>({wch:18}))];
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:header.length-1}},{s:{r:1,c:0},e:{r:1,c:header.length-1}}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Disponibilidade');
  XLSX.writeFile(wb, `disponibilidade-${chaveMes(ano,mes)}.xlsx`);
  toast('Planilha exportada');
}
function importarPlanilhaBtn(){ const i=document.getElementById('imp-file'); if(i) i.click(); }
function importarPlanilha(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Biblioteca de Excel indisponível'); return; }
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1, raw:false, defval:''});
      const hi=aoa.findIndex(r=> r && norm(r[0])==='data');
      if(hi<0){ toast('Planilha em formato inesperado'); return; }
      const header=aoa[hi]; const cols=[];
      for(let c=5;c<header.length;c++){ const nm=(header[c]||'').toString().trim(); if(!nm) continue; const m=db.membros.find(x=>norm(x.nome)===norm(nm)); cols.push({c, membroId:m?m.id:null, nome:nm}); }
      let add=0,dup=0,naoEnc=0; const faltam=new Set();
      for(let r=hi+1;r<aoa.length;r++){ const row=aoa[r]; if(!row||!row[0]) continue; const data=parseBR(row[0]); if(!data) continue;
        for(const mc of cols){ const v=norm(row[mc.c]||''); const naoPode = v && (v[0]==='n' || v.includes('nao')); if(!naoPode) continue;
          if(!mc.membroId){ naoEnc++; faltam.add(mc.nome); continue; }
          if(db.restricoes.some(x=>x.membroId===mc.membroId&&x.data===data)){ dup++; continue; }
          db.restricoes.push({id:uid(),membroId:mc.membroId,data}); add++; }
      }
      await salvar(); render();
      let msg=`${add} restrição(ões) importada(s)`; if(dup) msg+=` · ${dup} já existia(m)`; if(naoEnc) msg+=` · ${faltam.size} membro(s) não encontrado(s)`;
      toast(msg);
    }catch(err){ toast('Falha ao ler a planilha'); }
  };
  reader.readAsArrayBuffer(file);
}

/* =========================================================================
   EXPORTAÇÃO PDF
   ========================================================================= */
function membrosTexto(occ, atrib){ const ids=atrib[occ.key]||[]; let t=ids.map(nomeMembro).join(', '); const falta=Math.max(0,occ.vagas-ids.length); if(falta>0) t+=(t?'   ':'')+`[${falta} vaga(s) em aberto]`; return t||'[sem escalados]'; }
function detPDF(o){ const a=o.chegada?`cheg. ${o.chegada}`:''; const b=intervaloAscii(o); return [a,b].filter(Boolean).join(' · '); }
function exportarPDF(modo){
  if(!(window.jspdf&&window.jspdf.jsPDF)){ toast('Biblioteca de PDF indisponível'); return; }
  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'});
  const pageW=210,pageH=297,M=16; const navy=[0,37,84],gold=[201,144,54],ink=[28,38,62],sub=[120,128,148],white=[255,255,255];
  const { occs, atrib }=atribuicoesDoMes(); const ativas=occs.filter(o=>!o.cancelada);
  const rotulo=modo==='dia'?'Por dia':modo==='local'?'Por local':'Por membro'; let y,pagina=0;
  function rodape(){ doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...sub); doc.text('Instituto Beneditino em Adoração',M,pageH-9); doc.text(`Página ${pagina}`,pageW-M,pageH-9,{align:'right'}); }
  function novaPagina(primeira){ if(!primeira){ rodape(); doc.addPage(); } pagina++; try{ doc.addImage(LOGO_SRC,'PNG',M,11,18,18); }catch(e){}
    doc.setTextColor(...navy); doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.text('Escala da Liturgia',M+23,18);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...sub); doc.text('INSTITUTO BENEDITINO EM ADORAÇÃO',M+23,23.5);
    doc.setTextColor(...navy); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(`${MESES[selMes]} ${selAno}  ·  ${rotulo}`,M+23,29.5);
    doc.setDrawColor(...gold); doc.setLineWidth(0.8); doc.line(M,33,pageW-M,33); y=41; }
  function quebra(h){ if(y+h>pageH-16) novaPagina(false); }
  function titulo(txt){ quebra(13); doc.setFillColor(...navy); doc.roundedRect(M,y-5,pageW-2*M,8.5,1.4,1.4,'F'); doc.setTextColor(...white); doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(txt.toUpperCase(),M+3,y+0.8); y+=10; doc.setTextColor(...ink); }
  function linha(principal,detalhe,membros){ quebra(12); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...navy); doc.text(principal,M+1,y); if(detalhe){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...sub); doc.text(detalhe,pageW-M,y,{align:'right'}); } y+=5; doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink); const ls=doc.splitTextToSize(membros,pageW-2*M-2); for(const ln of ls){ quebra(6); doc.text(ln,M+1,y); y+=5; } y+=3.5; }
  novaPagina(true);
  if(ativas.length===0){ doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(...sub); doc.text('Nenhum evento neste mês.',M,y); rodape(); doc.save(`escala-${chaveMes(selAno,selMes)}-${modo}.pdf`); return; }
  if(modo==='dia'){ const porDia={}; ativas.forEach(o=>{ (porDia[o.data]=porDia[o.data]||[]).push(o); }); Object.keys(porDia).sort().forEach(data=>{ const f=formatData(data); titulo(`${f.semFull}, ${f.dm}`); porDia[data].forEach(o=>linha(`${o.tipo} · ${nomeLocal(o.localId)}`,detPDF(o),membrosTexto(o,atrib))); }); }
  else if(modo==='local'){ const porLocal={}; ativas.forEach(o=>{ (porLocal[o.localId]=porLocal[o.localId]||[]).push(o); }); db.locais.forEach(l=>{ const lista=(porLocal[l.id]||[]).sort((a,b)=>a.data===b.data?(a.horario||'').localeCompare(b.horario||''):a.data.localeCompare(b.data)); if(!lista.length) return; titulo(l.nome); lista.forEach(o=>{ const f=formatData(o.data); linha(`${f.sem} ${f.dm} · ${o.tipo}`,detPDF(o),membrosTexto(o,atrib)); }); }); }
  else { const ativos=db.membros.filter(m=>m.ativo); ativos.forEach(m=>{ titulo(m.nome); const serv=[]; ativas.forEach(o=>{ if((atrib[o.key]||[]).includes(m.id)) serv.push(o); }); serv.sort((a,b)=>a.data===b.data?(a.horario||'').localeCompare(b.horario||''):a.data.localeCompare(b.data)); if(!serv.length){ quebra(8); doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(...sub); doc.text('Sem serviços neste mês.',M+1,y); y+=8; doc.setFont('helvetica','normal'); } else { serv.forEach(o=>{ const f=formatData(o.data); quebra(7); doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink); doc.text(`${f.sem} ${f.dm}  —  ${o.tipo} · ${nomeLocal(o.localId)}${o.chegada?' · cheg. '+o.chegada:''}${o.horario?' · '+intervaloAscii(o):''}`,M+1,y); y+=6; }); y+=3; } }); }
  rodape(); doc.save(`escala-${chaveMes(selAno,selMes)}-${modo}.pdf`); toast('PDF gerado');
}

/* =========================================================================
   EXPORTAÇÃO PNG (WhatsApp)
   ========================================================================= */
function gerarPNG(){
  if(selecionados.size===0){ toast('Selecione ao menos um evento'); return; }
  const occs=construirOccs(selAno,selMes).filter(o=>!o.cancelada&&selecionados.has(o.key)).sort((a,b)=> a.data===b.data?(a.horario||'').localeCompare(b.horario||''):a.data.localeCompare(b.data));
  if(!occs.length){ toast('Nada para exportar'); return; }
  const { atrib }=atribuicoesDoMes();
  const ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  ready.then(()=>{ const img=new Image(); img.onload=()=>desenharPNG(occs,atrib,img); img.onerror=()=>desenharPNG(occs,atrib,null); img.src=LOGO_SRC; });
}
function desenharPNG(occs, atrib, logo, diaISO){
  const W=1080,P=64; const navy='#002554',card='#0B3263',gold='#C99036',goldL='#E2B968',white='#FFFFFF',soft='#D8E2F0',red='#F0726A';
  const c=document.createElement('canvas'); let ctx=c.getContext('2d');
  const F=(w,s)=>`${w} ${s}px Montserrat, Arial, sans-serif`;
  function wrap(text,font,maxW){ ctx.font=font; const words=String(text).split(' '); const ls=[]; let cur=''; for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){ ls.push(cur); cur=w; } else cur=t; } if(cur) ls.push(cur); return ls; }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  const innerW=W-2*P-60;
  const blocos=occs.map(o=>{ const ids=atrib[o.key]||[]; const falta=Math.max(0,o.vagas-ids.length);
    const evL=wrap(`${o.tipo}  ·  ${nomeLocal(o.localId)}`, F('700',34), innerW);
    const horas=`Chegar ${o.chegada||'—'}    •    Início ${o.horario||'—'}    •    Término ${o.horario?somaHora(o.horario,o.duracao):'—'}`;
    const horasL=wrap(horas, F('600',25), innerW);
    const obsL=o.obs?wrap(`Obs: ${o.obs}`, F('500',24), innerW):[];
    const nomes=ids.map(id=>nomeMembro(id));
    let h=28; h+=evL.length*44+6; h+=horasL.length*34+4; if(obsL.length) h+=obsL.length*32+2; h+=12; h+=(nomes.length||1)*40; if(falta>0) h+=34; h+=24;
    return {o,evL,horasL,obsL,nomes,falta,h};
  });
  function build(draw){
    let y=56;
    if(draw&&logo){ const s=140; ctx.drawImage(logo,(W-s)/2,y,s,s); }
    y+=140+28; ctx.textAlign='center';
    if(draw){ ctx.fillStyle=gold; ctx.font=F('700',23); ctx.fillText('INSTITUTO BENEDITINO EM ADORAÇÃO',W/2,y); }
    y+=23+26;
    const titulo=diaISO?`Escala · ${formatData(diaISO).semFull} ${formatData(diaISO).dm}`:`Escala · ${MESES[selMes]} ${selAno}`;
    if(draw){ ctx.fillStyle=white; ctx.font=F('700',44); ctx.fillText(titulo,W/2,y); }
    y+=44+22;
    if(draw){ ctx.strokeStyle=gold; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(P,y); ctx.lineTo(W-P,y); ctx.stroke(); }
    y+=38; ctx.textAlign='left';
    for(const b of blocos){ const x=P,w=W-2*P; if(draw){ ctx.fillStyle=card; rr(x,y,w,b.h,22); ctx.fill(); ctx.fillStyle=gold; rr(x,y,9,b.h,4); ctx.fill();
        let yy=y+28+24;
        ctx.fillStyle=white; ctx.font=F('700',34); for(const ln of b.evL){ ctx.fillText(ln,x+30,yy); yy+=44; } yy+=6;
        ctx.fillStyle=goldL; ctx.font=F('600',25); for(const ln of b.horasL){ ctx.fillText(ln,x+30,yy); yy+=34; } yy+=4;
        if(b.obsL.length){ ctx.fillStyle=soft; ctx.font=F('500',24); for(const ln of b.obsL){ ctx.fillText(ln,x+30,yy); yy+=32; } yy+=2; }
        yy+=12; ctx.font=F('500',30);
        if(b.nomes.length){ ctx.fillStyle=white; for(const nm of b.nomes){ ctx.fillText('•  '+nm,x+30,yy); yy+=40; } }
        else { ctx.fillStyle=soft; ctx.fillText('(ninguém alocado)',x+30,yy); yy+=40; }
        if(b.falta>0){ ctx.fillStyle=red; ctx.font=F('600',24); ctx.fillText(`${b.falta} vaga(s) em aberto`,x+30,yy); yy+=34; }
      } y+=b.h+22; }
    y+=6; if(draw){ ctx.textAlign='center'; ctx.fillStyle=gold; ctx.font=F('600',22); ctx.fillText('Instituto Beneditino em Adoração',W/2,y); ctx.textAlign='left'; }
    y+=40; return y;
  }
  const totalH=Math.ceil(build(false)); c.width=W; c.height=totalH; ctx=c.getContext('2d');
  ctx.fillStyle=navy; ctx.fillRect(0,0,W,totalH); build(true);
  const fname=diaISO?`escala-${diaISO}.png`:`escala-${chaveMes(selAno,selMes)}.png`;
  c.toBlob(blob=>{ if(!blob){ toast('Falha ao gerar PNG'); return; } const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); toast('PNG gerado'); },'image/png');
}

function occCard(o,atrib,occs){

function painelJustica(atrib){
  const totais=creditosBase(chaveMes(selAno,selMes)); const noMes={}; Object.values(atrib).forEach(ids=>ids.forEach(id=>{ noMes[id]=(noMes[id]||0)+1; }));

  const temMembro=restricaoMembro&&db.membros.some(m=>m.id===restricaoMembro);
  const podeSalvar=temMembro&&restricoesPendentes.length>0;
  const pend=restricoesPendentes.slice().sort().map(d=>{ const f=formatData(d); return `<span class="chip rest">${f.sem} ${f.dm}<button data-action="remDataPendente" data-data="${d}" aria-label="Remover">×</button></span>`; }).join('');
  const semMembros=db.membros.length===0;
  const noticeHtml=semMembros?`<div class="notice">${ico('warn')}<div>Cadastre os <strong>membros</strong> primeiro para registrar as restrições deles.</div></div>`:'';
  const marcarHtml=`<div class="card pad form-card">
      <div class="field"><label>1 · Membro</label>
        <select class="inp" id="r-membro" data-change="rMembro"><option value="">Escolha o membro</option>${db.membros.map(m=>`<option value="${m.id}" ${restricaoMembro===m.id?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></div>
      ${temMembro?`
      <div class="field" style="margin-top:14px"><label>2 · Clique nas datas indisponíveis de <strong style="color:var(--ink)">${esc(nomeMembro(restricaoMembro))}</strong></label>${calRestricoes()}</div>
      ${pend?`<div class="pend-chips">${pend}</div>`:`<p class="hint" style="margin-top:10px">Nenhuma data marcada. Clique nos dias do calendário — use as setas para mudar de mês.</p>`}
      <div style="margin-top:14px"><button class="btn primary" data-action="salvarRestricoes" ${podeSalvar?'':'disabled'}>${ico('check')} Salvar ${restricoesPendentes.length?restricoesPendentes.length+' ':''}restrição(ões) para ${esc(nomeMembro(restricaoMembro))}</button></div>
      `:`<p class="hint" style="margin-top:12px">Escolha um membro acima para abrir o calendário e marcar as datas.</p>`}
      <p class="hint" style="margin-top:8px">Restrição é regra absoluta: a pessoa nunca é escalada num dia indisponível.</p>
    </div>`;
  const excelHtml=`<div class="exp-bar xls"><span class="lbl">${ico('save')} Planilha p/ os membros (${MESES[restricaoCalMes]} ${restricaoCalAno}):</span>
      <button class="btn ghost" data-action="exportarPlanilha">Exportar Excel</button>
      <button class="btn ghost" data-action="importarPlanilhaBtn">Importar preenchida</button>
      <input type="file" id="imp-file" accept=".xlsx,.xls" data-import hidden>
      <span class="hint" style="margin:0">exporte → Drive → cada um marca → importe de volta</span>
    </div>
    <p class="hint" style="margin-top:12px">Exporte a planilha do mês, compartilhe com o grupo (cada pessoa marca os dias em que não pode) e importe de volta — todas as restrições entram de uma vez.</p>`;
  const listHtml=`${cadHead(db.restricoes.length)}${barraFiltro('restricoes','Buscar por membro ou data (ex.: 18/07)...')}<div id="lista-restricoes">${listaRestricoes()}</div>`;
  const sub=`<div class="subtabs">${subTab('restricoes','marcar','ban','Marcar')}${subTab('restricoes','cadastradas','check','Cadastradas ('+db.restricoes.length+')')}${subTab('restricoes','disponib','users','Disponib.')}${subTab('restricoes','excel','save','Excel')}</div>`;
  const cur=subAba.restricoes;
  const body = cur==='cadastradas' ? listHtml : cur==='excel' ? excelHtml : cur==='disponib' ? painelDisponib() : marcarHtml;
  return `<h2 class="sec">Restrições</h2>${noticeHtml}${sub}${body}`;
}
function calRestricoes(){
  const ano=restricaoCalAno, mes=restricaoCalMes;
  const total=diasDoMes(ano,mes); const first=new Date(ano,mes,1).getDay(); const hoje=hojeISO();
  let cells=DSEMA.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) cells+=`<div class="cal-empty"></div>`;
  for(let d=1;d<=total;d++){ const ds=iso(ano,mes,d);
    const saved=db.restricoes.some(r=>r.membroId===restricaoMembro&&r.data===ds);
    const pend=restricoesPendentes.includes(ds); const today=ds===hoje;
    const cls=['cal-day']; if(saved)cls.push('saved'); if(pend)cls.push('pend'); if(today)cls.push('today');
    const attrs=saved?'':`data-action="toggleDiaRestricao" data-data="${ds}"`;
    cells+=`<div class="${cls.join(' ')}" ${attrs}>${d}</div>`; }
  return `<div class="cal-mini"><div class="cal-top"><button class="iconbtn sm" data-action="calPrev" aria-label="Mês anterior">${ico('chevL')}</button><div class="cal-month">${MESES[mes]} ${ano}</div><button class="iconbtn sm" data-action="calNext" aria-label="Próximo mês">${ico('chevR')}</button></div>
  <div class="cal-grid">${cells}</div>
  <div class="cal-legend"><span><i class="lg pend"></i> marcada (vai salvar)</span><span><i class="lg saved"></i> já é restrição</span></div></div>`;
}
function listaRestricoes(){
  if(!db.restricoes.length) return vazio('ban','Nenhuma restrição','Escolha um membro acima e marque as datas no calendário.');
  const q=norm(filtros.restricoes);
  const porMembro={}; db.restricoes.forEach(r=>{ (porMembro[r.membroId]=porMembro[r.membroId]||[]).push(r); });
  const ids=Object.keys(porMembro).sort((a,b)=>nomeMembro(a).localeCompare(nomeMembro(b)));
  const cards=ids.map(mid=>{ const nome=nomeMembro(mid); const datas=porMembro[mid].slice().sort((a,b)=>a.data.localeCompare(b.data));
    const texto=norm(nome+' '+datas.map(r=>{ const f=formatData(r.data); return f.semFull+' '+f.dmy; }).join(' '));
    if(q&&!texto.includes(q)) return '';
    const chips=datas.map(r=>{ const f=formatData(r.data); return `<span class="chip rest">${f.sem} ${f.dm}<button data-action="delRestricao" data-id="${r.id}" aria-label="Remover">×</button></span>`; }).join('');
    return `<div class="row" style="align-items:flex-start"><div class="grow"><div class="name">${esc(nome)} <span class="muted" style="font-weight:500">· ${datas.length} data(s)</span></div><div class="chips" style="margin-top:8px;padding-left:0">${chips}</div></div><button class="iconbtn sm" data-action="addMaisRestricoes" data-mid="${mid}" aria-label="Adicionar mais" title="Adicionar mais datas">${ico('plus')}</button></div>`;
  }).join('');
  return cards.trim()?cards:semResultado();
}

  show('rec-wrap', freq!=='naoRepete'); show('grp-semana', freq==='semanal'); show('grp-mensal', freq==='mensal');

  const un=document.getElementById('ev-unidade'); if(un){ const u={diario:['dia','dias'],semanal:['semana','semanas'],mensal:['mês','meses'],anual:['ano','anos']}[freq]; if(u) un.textContent=n===1?u[0]:u[1]; }

function atualizarFim(){ const t=(document.getElementById('ev-fimTipo')||{}).value; const show=(id,on)=>{ const el=document.getElementById(id); if(el) el.classList.toggle('hidden', !on); }; show('grp-fim-ate', t==='ate'); show('grp-fim-apos', t==='apos'); }
function atualizarMensalOpcoes(){ const di=document.getElementById('ev-dataInicio'); const sel=document.getElementById('ev-mensalModo'); if(!di||!sel||!di.value) return; const dp=dataPartes(di.value); const ord=ordinalSemana(di.value); const fem=ehFeminino(dp.wd); if(sel.options[0]) sel.options[0].text=`No dia ${dp.dia}`; if(sel.options[1]) sel.options[1].text=`${fem?'Na':'No'} ${ordinalLabel(ord,fem)} ${DSEM[dp.wd]}`; }
function sincronizarDiaSemana(dateStr){ if(!dateStr) return; const wd=dataPartes(dateStr).wd; document.querySelectorAll('[data-wd]').forEach(c=>{ c.checked=(parseInt(c.value,10)===wd); }); }

function atualizarLista(tab){ const map={membros:['lista-membros',listaMembros],locais:['lista-locais',listaLocais],eventos:['lista-eventos',listaEventos],restricoes:['lista-restricoes',listaRestricoes]}; const m=map[tab]; if(!m) return; const el=document.getElementById(m[0]); if(el) el.innerHTML=m[1](); }

/* ---------- Listeners delegados (anexados uma vez) ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-action]'); if(!el) return; const a=el.getAttribute('data-action');
  const id=el.getAttribute('data-id'), occ=el.getAttribute('data-occ'), ev=el.getAttribute('data-ev'), data=el.getAttribute('data-data'), tab=el.getAttribute('data-tab'), t=el.getAttribute('data-t'), mid=el.getAttribute('data-mid'), modo=el.getAttribute('data-modo');
  switch(a){
    case 'tema': alternarTema(); break;
    case 'cancelarConfirmacao': cancelarConfirmacao(); break;
    case 'confirmarPendente': confirmarPendente(); break;
    case 'aba': abaAtiva=id; movendo=null; render(); break;
    case 'subaba': { const g=el.getAttribute('data-grupo'); if(g) subAba[g]=id; render(); break; }
    case 'mesPrev': navMes(-1); break;
    case 'mesNext': navMes(1); break;
    case 'gerar': gerar(); break;
    case 'salvarEscala': salvarEscala(); break;
    case 'pdf': exportarPDF(modo); break;
    case 'baixarPdf': exportarPDF(modo); break;
    case 'previa': setPrevia(modo); break;
    case 'previaFechar': previaModo=null; render(); break;
    case 'abrirCalendario': abrirCalendario(); break;
    case 'fecharCalendario': fecharCalendario(); break;
    case 'calDia': setCalDia(data); break;
    case 'pngDia': gerarPNGdia(data); break;
    case 'imprimirManual': window.print(); break;
    case 'png': gerarPNG(); break;
    case 'limparSel': limparSel(); break;
    case 'toggleSel': toggleSel(occ); break;
    case 'remSlot': if(movendo&&movendo.occ===occ&&movendo.id===id) movendo=null; removerSlot(occ,id); break;
    case 'pegar': pegar(occ,id); break;
    case 'soltarVaga': soltarVaga(occ); break;
    case 'cancelarMover': cancelarMover(); break;
    case 'cancelarOcc': cancelarOcc(ev,data); break;
    case 'restaurarOcc': restaurarOcc(ev,data); break;
    case 'cancelEdit': cancelEdit(tab); break;
    case 'salvarMembro': salvarMembro(); break;
    case 'editMembro': irEditar('membros',id); break;
    case 'delMembro': delMembro(id); break;
    case 'salvarLocal': salvarLocal(); break;
    case 'salvarFase': salvarFase(); break;
    case 'editFase': irEditar('fases',id); break;
    case 'delFase': delFase(id); break;
    case 'addFaseData': addFaseData(id); break;
    case 'delFaseData': delFaseData(id, data); break;
    case 'editLocal': irEditar('locais',id); break;
    case 'delLocal': delLocal(id); break;
    case 'salvarEvento': salvarEvento(); break;
    case 'editEvento': irEditar('eventos',id); break;
    case 'delEvento': delEvento(id); break;
    case 'salvarTipo': salvarTipo(); break;
    case 'criarTipoInline': criarTipoInline(); break;
    case 'cancelarTipoNovo': cancelarTipoNovo(); break;
    case 'editTipo': edit.tipos=t; render(); break;
    case 'delTipo': delTipo(t); break;
    case 'salvarRestricoes': salvarRestricoes(); break;
    case 'puxarDisponibilidades': puxarDisponibilidades(); break;
    case 'addMaisRestricoes': addMaisRestricoes(mid); break;

function msgLogin(t){ const m=document.getElementById('loginMsg'); if(m) m.textContent=t||''; }
function mostrarLogin(){ const o=document.getElementById('loginOverlay'); if(o) o.style.display='flex'; const pl=document.getElementById('painelLogin'), ps=document.getElementById('painelSenha'); if(pl) pl.style.display='block'; if(ps) ps.style.display='none'; msgLogin(''); }

function ocultarLogin(){ const o=document.getElementById('loginOverlay'); if(o) o.style.display='none'; }
let _trocaManual=false;
async function fazerLogin(){
  const email=(document.getElementById('loginEmail').value||'').trim();
  const senha=(document.getElementById('loginSenha').value||'');
  if(!email||!senha){ msgLogin('Preencha e-mail e senha.'); return; }
  msgLogin('Entrando…');
  try{ const { error }=await sbAuth.entrar(email,senha); if(error){ msgLogin('E-mail ou senha incorretos.'); } }
  catch(e){ msgLogin('Erro ao entrar. Tente de novo.'); }
}
async function enviarReset(){
  const email=(document.getElementById('loginEmail').value||'').trim();
  if(!email){ msgLogin('Digite seu e-mail acima e clique de novo em “Esqueci minha senha”.'); return; }
  msgLogin('Enviando…');
  try{ const { error }=await sbAuth.esqueciSenha(email); msgLogin(error?('Erro: '+error.message):'Enviamos um link para o seu e-mail. Abra e defina a nova senha.'); }
  catch(e){ msgLogin('Erro ao enviar. Tente de novo.'); }
}
async function salvarNovaSenha(){
  const s1=(document.getElementById('novaSenha').value||''); const s2=(document.getElementById('novaSenha2').value||'');
  if(s1.length<8){ msgLogin('A senha precisa ter ao menos 8 caracteres.'); return; }
  if(s1!==s2){ msgLogin('As senhas não conferem.'); return; }
  msgLogin('Salvando…');
  try{
    const { error }=await sbAuth.definirSenha(s1);
    if(error){ msgLogin('Erro: '+error.message); return; }
    history.replaceState(null,'',window.location.pathname+window.location.search); // limpa o hash do convite/reset
    if(_trocaManual){ _trocaManual=false; ocultarLogin(); toast('Senha atualizada'); }
    else { ocultarLogin(); await carregarErenderizar(); }
  }catch(e){ msgLogin('Erro ao salvar. Tente de novo.'); }
}
async function carregarErenderizar(){
  const ok=await carregar();
  if(!ok){ db=seed(); toast('Não consegui ler os dados da nuvem'); }
  aplicarTema();
  const d=new Date(); const prox=new Date(d.getFullYear(),d.getMonth()+1,1); setMes(prox.getFullYear(),prox.getMonth());
}
function trocarSenha(){ _trocaManual=true; const n1=document.getElementById('novaSenha'); const n2=document.getElementById('novaSenha2'); if(n1) n1.value=''; if(n2) n2.value=''; mostrarDefinirSenha(); }
async function init(){
  aplicarTema();
  const lb=document.getElementById('loginBtn'); if(lb) lb.onclick=fazerLogin;
  const ls=document.getElementById('loginSenha'); if(ls) ls.onkeydown=e=>{ if(e.key==='Enter') fazerLogin(); };
  const es=document.getElementById('linkEsqueci'); if(es) es.onclick=e=>{ e.preventDefault(); enviarReset(); };
  const ss=document.getElementById('salvarSenhaBtn'); if(ss) ss.onclick=salvarNovaSenha;
  const n2=document.getElementById('novaSenha2'); if(n2) n2.onkeydown=e=>{ if(e.key==='Enter') salvarNovaSenha(); };

  const tipo=sbAuth.tipoNaUrl();            // veio de um link de convite ou de reset?
  const sessao=await sbAuth.sessao();
  if(tipo==='invite'||tipo==='recovery'){ mostrarDefinirSenha(); }
  else if(sessao){ ocultarLogin(); await carregarErenderizar(); }
  else { mostrarLogin(); }

  sbAuth.aoMudar(async (evt,s)=>{
    if(evt==='PASSWORD_RECOVERY'){ mostrarDefinirSenha(); return; }
    if(_trocaManual) return;                 // trocando senha dentro do app: não recarrega
    if(s){ if(!sbAuth.tipoNaUrl()){ ocultarLogin(); await carregarErenderizar(); } }
    else { mostrarLogin(); }
  });
}

function telaCalendario(){

  }
